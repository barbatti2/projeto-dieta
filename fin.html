  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --navy: #10182f;
      --navy-soft: #1a243d;
      --ink: #101114;
      --muted: #777a80;
      --line: #e1e2e5;
      --surface: #ffffff;
      --canvas: #f7f8fa;
      --paid: #16bd91;
      --paid-soft: #d7f8eb;
      --pending: #ffbd24;
      --pending-soft: #fff2c8;
      --overdue: #ff3f68;
      --overdue-soft: #ffe0e7;
      --danger: #f24449;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08), 0 2px 5px rgba(15, 23, 42, 0.06);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html {
      min-height: 100%;
      background: var(--canvas);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -25%, rgba(32, 54, 95, 0.08), transparent 36rem),
        var(--canvas);
      color: var(--ink);
      overscroll-behavior-y: contain;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(38, 99, 235, 0.24);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 1.5rem;
      height: 1.5rem;
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      min-height: 104px;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(110deg, #1b263e 0%, var(--navy) 75%);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
    }

    .topbar-inner {
      width: min(100%, 1120px);
      min-height: 104px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      color: white;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
    }

    .brand-mark .icon {
      width: 33px;
      height: 33px;
    }

    .brand-name {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.05rem);
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-tab {
      width: 62px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .nav-tab .icon {
      width: 28px;
      height: 28px;
    }

    .nav-tab:hover {
      color: white;
      transform: translateY(-1px);
    }

    .nav-tab.active {
      background: white;
      color: var(--navy);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
    }

    .app-shell {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 66px 24px 80px;
    }

    .page-enter {
      animation: pageIn 360ms cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .month-control {
      min-height: 110px;
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      align-items: center;
      overflow: hidden;
      border-radius: 30px;
      color: white;
      background: linear-gradient(105deg, #1d283f 0%, #111a32 58%, #0d1429 100%);
      box-shadow: 0 10px 23px rgba(15, 23, 42, 0.16);
    }

    .month-arrow,
    .month-open {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: inherit;
    }

    .month-arrow {
      transition: background 180ms ease;
    }

    .month-arrow:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .month-arrow .icon {
      width: 32px;
      height: 32px;
    }

    .month-open {
      gap: 22px;
      font-size: clamp(1.65rem, 4vw, 2.15rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .month-open .icon {
      width: 34px;
      height: 34px;
      color: #dce3f0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      margin-top: 46px;
    }

    .summary-panel {
      position: relative;
      min-height: 158px;
      display: flex;
      align-items: center;
      gap: 28px;
      overflow: hidden;
      padding: 30px 38px;
      border-radius: 30px;
      color: white;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
      isolation: isolate;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .summary-panel::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: -80%;
      left: -35%;
      width: 36%;
      height: 250%;
      transform: rotate(20deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
      animation: sheen 6s ease-in-out infinite;
    }

    .summary-panel:nth-child(2)::after {
      animation-delay: 1.1s;
    }

    @keyframes sheen {
      0%, 68% { left: -45%; }
      100% { left: 125%; }
    }

    .summary-panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 28px rgba(15, 23, 42, 0.15);
    }

    .summary-panel.unpaid {
      background: linear-gradient(125deg, #f83269 0%, #ff622d 100%);
    }

    .summary-panel.paid {
      background: linear-gradient(125deg, #10bd8f 0%, #20b9a6 100%);
    }

    .summary-icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.16);
    }

    .summary-icon .icon {
      width: 48px;
      height: 48px;
      stroke-width: 1.7;
    }

    .summary-label {
      margin: 0 0 3px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 1.35rem;
      font-weight: 450;
    }

    .summary-value {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.45rem);
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .primary-wide {
      width: 100%;
      min-height: 72px;
      margin-top: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
      background: var(--navy);
      color: white;
      font-size: 1.75rem;
      font-weight: 520;
      box-shadow: 0 7px 14px rgba(15, 23, 42, 0.16);
      transition: transform 180ms ease, background 180ms ease;
    }

    .primary-wide:hover {
      transform: translateY(-2px);
      background: #18223c;
    }

    .primary-wide:active {
      transform: translateY(0) scale(0.995);
    }

    .primary-wide .icon {
      width: 31px;
      height: 31px;
    }

    .accounts-list {
      display: grid;
      gap: 30px;
      margin-top: 50px;
    }

    .account-card {
      --status-color: var(--pending);
      position: relative;
      overflow: hidden;
      min-height: 225px;
      padding: 34px 38px 27px 48px;
      border: 2px solid var(--line);
      border-radius: 31px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: cardIn 430ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .account-card::before {
      content: "";
      position: absolute;
      inset: -2px auto -2px -2px;
      width: 13px;
      border-radius: 31px 0 0 31px;
      background: var(--status-color);
    }

    .account-card.status-paid { --status-color: var(--paid); }
    .account-card.status-overdue { --status-color: var(--overdue); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .account-top,
    .account-middle {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 22px;
    }

    .account-middle {
      align-items: end;
      margin-top: 30px;
    }

    .account-identity {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .status-symbol {
      color: var(--status-color);
      margin-top: 2px;
    }

    .status-symbol .icon {
      width: 36px;
      height: 36px;
      stroke-width: 1.8;
    }

    .account-name {
      margin: 0;
      overflow: hidden;
      color: #0c0d0f;
      font-size: 1.75rem;
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-due {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 1.35rem;
      line-height: 1.25;
    }

    .account-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .status-badge {
      min-height: 45px;
      display: inline-flex;
      align-items: center;
      padding: 6px 19px;
      border-radius: 999px;
      background: var(--pending-soft);
      color: #ae591c;
      font-size: 1.2rem;
      font-weight: 580;
      white-space: nowrap;
    }

    .status-overdue .status-badge {
      background: var(--overdue-soft);
      color: #bd2448;
    }

    .status-paid .status-badge {
      background: var(--paid-soft);
      color: #11785e;
    }

    .icon-btn {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: #101114;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      background: #f1f2f4;
    }

    .icon-btn.delete {
      color: #7c7d80;
    }

    .icon-btn.delete:hover {
      color: var(--danger);
      background: #fff0f1;
    }

    .icon-btn .icon {
      width: 30px;
      height: 30px;
    }

    .account-value {
      margin: 0;
      color: #08090b;
      font-size: clamp(2rem, 5vw, 2.55rem);
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .account-value.no-value {
      color: var(--muted);
      font-size: 1.35rem;
      font-weight: 520;
      letter-spacing: 0;
    }

    .pay-btn {
      min-width: 176px;
      min-height: 66px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 16px;
      background: var(--navy);
      color: white;
      font-size: 1.45rem;
      font-weight: 620;
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.18);
      transition: transform 180ms ease, background 180ms ease;
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      background: #1b2744;
    }

    .pay-btn .icon {
      width: 31px;
      height: 31px;
    }

    .undo-btn {
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      gap: 13px;
      padding: 8px 12px;
      border-radius: 12px;
      background: transparent;
      color: #77787c;
      font-size: 1.35rem;
      font-weight: 500;
    }

    .undo-btn:hover {
      background: #f3f4f5;
      color: var(--navy);
    }

    .undo-btn .icon {
      width: 30px;
      height: 30px;
    }

    .account-note {
      margin: 30px 0 0;
      padding: 22px 0 0;
      display: flex;
      align-items: center;
      gap: 13px;
      overflow: hidden;
      border-top: 2px solid #e7e7e7;
      color: var(--muted);
      font-size: 1.2rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-note .icon {
      width: 25px;
      height: 25px;
    }

    .empty-state {
      margin-top: 52px;
      padding: 50px 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
    }

    .empty-state .icon {
      width: 52px;
      height: 52px;
      margin-bottom: 15px;
      color: #a1a5ad;
    }

    .empty-state h3 {
      margin: 0;
      color: var(--ink);
      font-size: 1.35rem;
    }

    .empty-state p {
      margin: 8px auto 22px;
      max-width: 440px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .empty-action,
    .compact-primary {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border-radius: 13px;
      background: var(--navy);
      color: white;
      font-size: 1rem;
      font-weight: 620;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.15);
    }

    .manage-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
    }

    .manage-heading h2 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.55rem);
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: -0.045em;
    }

    .manage-heading p {
      max-width: 600px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.45rem;
      line-height: 1.45;
    }

    .new-template-btn {
      min-width: 182px;
      min-height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      border-radius: 15px;
      background: var(--navy);
      color: white;
      font-size: 1.35rem;
      box-shadow: 0 6px 13px rgba(15, 23, 42, 0.17);
    }

    .new-template-btn .icon {
      width: 29px;
      height: 29px;
    }

    .template-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      margin-top: 58px;
    }

    .stat-block {
      min-height: 158px;
      padding: 38px 48px;
      border: 2px solid var(--line);
      border-radius: 31px;
      background: rgba(255, 255, 255, 0.7);
    }

    .stat-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 1.25rem;
    }

    .stat-value {
      margin: 0;
      color: var(--navy);
      font-size: 2rem;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .templates-list {
      display: grid;
      gap: 28px;
      margin-top: 58px;
    }

    .manage-settings-link {
      min-height: 52px;
      margin: 40px auto 0;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 13px;
      background: transparent;
      color: #666a72;
      font-weight: 620;
      transition: color 180ms ease, background 180ms ease;
    }

    .manage-settings-link:hover {
      background: #eceef2;
      color: var(--navy);
    }

    .template-row {
      min-height: 142px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 35px;
      padding: 27px 38px;
      border: 2px solid var(--line);
      border-radius: 28px;
      background: white;
      box-shadow: var(--shadow);
      animation: cardIn 430ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .template-info {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .template-icon {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 23px;
      background: #e8e9ec;
      color: var(--navy);
    }

    .template-icon .icon {
      width: 41px;
      height: 41px;
    }

    .template-name {
      margin: 0;
      overflow: hidden;
      font-size: 1.75rem;
      font-weight: 720;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .template-meta {
      margin: 7px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 1.25rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .template-value {
      min-width: 210px;
      margin: 0;
      font-size: 2rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-align: right;
      white-space: nowrap;
    }

    .template-value.no-value {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 560;
      letter-spacing: 0;
    }

    .template-actions {
      display: flex;
      gap: 17px;
    }

    .modal-layer[hidden] {
      display: none;
    }

    .modal-layer {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(8, 13, 27, 0.52);
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .modal-layer.active {
      opacity: 1;
    }

    .modal-panel {
      position: relative;
      width: min(100%, 720px);
      max-height: min(90vh, 900px);
      overflow-y: auto;
      padding: 38px 48px 42px;
      border-radius: 28px;
      background: white;
      box-shadow: 0 28px 65px rgba(3, 8, 20, 0.26);
      transform: translateY(18px) scale(0.985);
      transition: transform 220ms cubic-bezier(.2, .8, .2, 1);
    }

    .modal-layer.active .modal-panel {
      transform: translateY(0) scale(1);
    }

    .modal-panel.modal-small {
      width: min(100%, 620px);
    }

    .modal-close {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 44px;

    function localToday() {
      const now = new Date();

    function monthKeyFromDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function currentMonthKey() {
      return monthKeyFromDate(localToday());
    }

    function parseMonthKey(key) {
      const [year, month] = key.split("-").map(Number);
      return { year, month };
    }

    function shiftMonth(key, amount) {
      const { year, month } = parseMonthKey(key);
      const date = new Date(year, month - 1 + amount, 1);
      return monthKeyFromDate(date);
    }

    function daysInMonth(key) {
      const { year, month } = parseMonthKey(key);
      return new Date(year, month, 0).getDate();
    }

    function dateForMonth(key, day) {
      return `${key}-${String(Math.min(Math.max(Number(day) || 1, 1), daysInMonth(key))).padStart(2, "0")}`;

      ];
      const accounts = templates.map((item, index) => ({
        id: `seed-${item.id}`,
        recurringId: item.id,
        name: item.name,
        value: item.value,
        dueDate: dateForMonth(selectedMonth, item.dueDay),
        note: item.note,
        paid: index === 3,
        createdAt: Date.now() + index
      }));
      return {
        version: 1,
        selectedMonth,
        accounts,
        templates,
        notificationSent: {}
      };
    }

    function normalizeState(candidate) {
      const fallback = seedState();
      if (!candidate || typeof candidate !== "object") return fallback;
      return {
        version: 1,
        selectedMonth: /^\d{4}-\d{2}$/.test(candidate.selectedMonth || "") ? candidate.selectedMonth : fallback.selectedMonth,
        accounts: Array.isArray(candidate.accounts) ? candidate.accounts : fallback.accounts,
        templates: Array.isArray(candidate.templates) ? candidate.templates : fallback.templates,
        notificationSent: candidate.notificationSent && typeof candidate.notificationSent === "object" ? candidate.notificationSent : {}
      };
    }

    function loadState() {
      try {
        return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)));
      } catch (error) {
        console.warn("Não foi possível ler os dados locais.", error);
        return seedState();
      }
    }

    let state = loadState();

    function persist(options = {}) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!options.localOnly) scheduleCloudWrite();
    }

    function scheduleCloudWrite() {
      if (!cloudDocument) return;
      clearTimeout(cloudWriteTimer);
      cloudWriteTimer = setTimeout(async () => {
        try {
          const { setDoc, serverTimestamp } = cloudDocument.methods;
          await setDoc(cloudDocument.ref, { payload: state, updatedAt: serverTimestamp() }, { merge: true });
          cloudStatus = "connected";
        } catch (error) {
          cloudStatus = "error";
          console.error("Falha ao sincronizar com o Firestore.", error);
        }
      }, 700);
    }

    async function initializeFirestore() {
      const isConfigured = firebaseConfig.apiKey && firebaseConfig.projectId && !FIREBASE_DOCUMENT_ID.startsWith("troque-");
      if (!isConfigured) return;
      cloudStatus = "connecting";
      try {
        const [{ initializeApp }, firestore] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js")
        ]);
        const firebaseApp = initializeApp(firebaseConfig);
        const db = firestore.getFirestore(firebaseApp);
        const ref = firestore.doc(db, "fincontrol", FIREBASE_DOCUMENT_ID);
        cloudDocument = { ref, methods: firestore };
        const snapshot = await firestore.getDoc(ref);
        if (snapshot.exists() && snapshot.data().payload) {
          state = normalizeState(snapshot.data().payload);
          persist({ localOnly: true });
          render();
        } else {
          await firestore.setDoc(ref, { payload: state, updatedAt: firestore.serverTimestamp() });
        }
        cloudStatus = "connected";
      } catch (error) {
        cloudStatus = "error";
        console.error("Firebase não pôde ser inicializado.", error);
      }
    }

    function icon(name, className = "") {
      return `<svg class="icon ${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    }

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    function formatMoney(cents) {
      if (cents === null || cents === undefined || cents === "") return null;
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(cents) / 100);
    }

    function formatDue(dateString) {
      const date = parseLocalDate(dateString);
      return `${String(date.getDate()).padStart(2, "0")}/${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthTitle(key) {
      const { year, month } = parseMonthKey(key);
      return `${monthNames[month - 1]}/${year}`;
    }

    function statusFor(account) {
      if (account.paid) return "paid";
      return parseLocalDate(account.dueDate) < localToday() ? "overdue" : "pending";
    }

    function statusLabel(status) {
      return { paid: "Pago", overdue: "Atrasada", pending: "Pendente" }[status];
    }

    function statusIcon(status) {
      return { paid: "check-circle", overdue: "alert", pending: "clock" }[status];
    }

    function monthAccounts() {
      return state.accounts
        .filter(account => account.dueDate && account.dueDate.startsWith(state.selectedMonth))
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate) || Number(a.paid) - Number(b.paid) || a.name.localeCompare(b.name));
    }

    function calculateTotals(accounts) {
      return accounts.reduce((totals, account) => {
        const value = Number(account.value) || 0;
        if (account.paid) totals.paid += value;
        else totals.unpaid += value;
        return totals;
      }, { paid: 0, unpaid: 0 });
    }

    function updateNavigation() {
      document.querySelectorAll("[data-nav]").forEach(button => {
        const active = button.dataset.nav === activePage;
        button.classList.toggle("active", active);
        if (active) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function accountCard(account, index) {
      const status = statusFor(account);
      const note = account.note ? `
        <p class="account-note">${icon("file")}<span>${escapeHTML(account.note)}</span></p>` : "";
      const value = formatMoney(account.value);
      const action = account.paid
        ? `<button class="undo-btn" type="button" data-action="undo-payment" data-id="${account.id}">${icon("undo")} Desfazer</button>`
        : `<button class="pay-btn" type="button" data-action="pay" data-id="${account.id}">${icon("check-circle")} Pagar</button>`;

      return `
        <article class="account-card status-${status}" style="animation-delay:${Math.min(index * 55, 330)}ms">
          <div class="account-top">
            <div class="account-identity">
              <span class="status-symbol">${icon(statusIcon(status))}</span>
              <div>
                <h3 class="account-name" title="${escapeHTML(account.name)}">${escapeHTML(account.name)}</h3>
                <p class="account-due">Vence em ${formatDue(account.dueDate)}</p>
              </div>
            </div>
            <div class="account-controls">
              <span class="status-badge">${statusLabel(status)}</span>
              <button class="icon-btn" type="button" data-action="edit-account" data-id="${account.id}" aria-label="Editar ${escapeHTML(account.name)}">${icon("edit")}</button>
              <button class="icon-btn delete" type="button" data-action="delete-account" data-id="${account.id}" aria-label="Excluir ${escapeHTML(account.name)}">${icon("trash")}</button>
            </div>
          </div>
          <div class="account-middle">
            <p class="account-value ${value ? "" : "no-value"}">${value || "Valor não definido"}</p>
            ${action}
          </div>
          ${note}
        </article>`;
    }

    function renderMonthPage() {
      const accounts = monthAccounts();
      const totals = calculateTotals(accounts);
      const content = accounts.length
        ? `<div class="accounts-list">${accounts.map(accountCard).join("")}</div>`
        : `<section class="empty-state">
            ${icon("calendar-days")}
            <h3>Nenhuma conta neste mês</h3>
            <p>Adicione uma conta avulsa ou gere o mês usando seus modelos recorrentes.</p>
            <button class="empty-action" type="button" data-action="generate-templates">${icon("plus")} Gerar contas recorrentes</button>
          </section>`;

      app.innerHTML = `
        <section class="page-enter" aria-labelledby="monthHeading">
          <div class="month-control">
            <button class="month-arrow" type="button" data-action="previous-month" aria-label="Mês anterior">${icon("chevron-left")}</button>
            <button class="month-open" type="button" data-action="open-month-picker" aria-label="Escolher mês e ano">
              ${icon("calendar")} <span id="monthHeading">${monthTitle(state.selectedMonth)}</span>
            </button>
            <button class="month-arrow" type="button" data-action="next-month" aria-label="Próximo mês">${icon("chevron-right")}</button>
          </div>

          <div class="summary-grid" aria-label="Resumo do mês">
            <div class="summary-panel unpaid">
              <div class="summary-icon">${icon("clock")}</div>
              <div><p class="summary-label">A pagar</p><p class="summary-value">${formatMoney(totals.unpaid)}</p></div>
            </div>
            <div class="summary-panel paid">
              <div class="summary-icon">${icon("check-circle")}</div>
              <div><p class="summary-label">Pago</p><p class="summary-value">${formatMoney(totals.paid)}</p></div>
            </div>
          </div>

          <button class="primary-wide" type="button" data-action="new-account">${icon("plus")} Nova conta</button>
          ${content}
        </section>`;
    }

    function templateRow(template, index) {
      const meta = `Vence dia ${template.dueDay}${template.note ? ` · ${escapeHTML(template.note)}` : ""}`;
      const value = formatMoney(template.value);
      return `
        <article class="template-row" style="animation-delay:${Math.min(index * 55, 330)}ms">
          <div class="template-info">
            <div class="template-icon">${icon("calendar-days")}</div>
            <div>
              <h3 class="template-name" title="${escapeHTML(template.name)}">${escapeHTML(template.name)}</h3>
              <p class="template-meta" title="${meta}">${meta}</p>
            </div>
          </div>
          <p class="template-value ${value ? "" : "no-value"}">${value || "Sem valor padrão"}</p>
          <div class="template-actions">
            <button class="icon-btn" type="button" data-action="edit-template" data-id="${template.id}" aria-label="Editar ${escapeHTML(template.name)}">${icon("edit")}</button>
            <button class="icon-btn delete" type="button" data-action="delete-template" data-id="${template.id}" aria-label="Excluir ${escapeHTML(template.name)}">${icon("trash")}</button>
          </div>
        </article>`;
    }

    function renderManagePage() {
      const total = state.templates.reduce((sum, item) => sum + (Number(item.value) || 0), 0);
      const list = state.templates.length
        ? `<div class="templates-list">${state.templates.slice().sort((a, b) => a.dueDay - b.dueDay).map(templateRow).join("")}</div>`
        : `<section class="empty-state">${icon("calendar-days")}<h3>Nenhuma conta recorrente</h3><p>Cadastre seus modelos fixos para agilizar a criação das contas mensais.</p></section>`;

      app.innerHTML = `
        <section class="page-enter" aria-labelledby="manageHeading">
          <div class="manage-heading">
            <div>
              <h2 id="manageHeading">Contas recorrentes</h2>
              <p>Modelos fixos usados para gerar as contas do mês.</p>
            </div>
            <button class="new-template-btn" type="button" data-action="new-template">${icon("plus")} Nova</button>
          </div>

          <div class="template-stats" aria-label="Resumo das contas recorrentes">
            <div class="stat-block"><p class="stat-label">Contas cadastradas</p><p class="stat-value">${state.templates.length}</p></div>
            <div class="stat-block"><p class="stat-label">Total estimado</p><p class="stat-value">${formatMoney(total)}</p></div>
          </div>
          ${list}
          <button class="manage-settings-link" type="button" data-action="open-settings">${icon("bell")} Alertas e sincronização</button>
        </section>`;
    }

    function render() {
      updateNavigation();
      if (activePage === "manage") renderManagePage();
      else renderMonthPage();
    }

    function openModal(content, options = {}) {
      lastFocusedElement = document.activeElement;
      modalPanel.className = `modal-panel${options.small ? " modal-small" : ""}`;
      modalPanel.innerHTML = content;
      modalLayer.hidden = false;
      modalLayer.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      requestAnimationFrame(() => {
        modalLayer.classList.add("active");
        const autofocus = modalPanel.querySelector("[autofocus]");
        (autofocus || modalPanel.querySelector("button, input, select, textarea"))?.focus({ preventScroll: true });
      });
    }

    function closeModal() {
      modalLayer.classList.remove("active");
      modalLayer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      setTimeout(() => {
        modalLayer.hidden = true;
        modalPanel.innerHTML = "";
        lastFocusedElement?.focus?.({ preventScroll: true });
      }, 190);
    }

    function closeButton() {
      return `<button class="modal-close" type="button" data-action="close-modal" aria-label="Fechar">${icon("x")}</button>`;
    }

    function currencyFieldValue(value) {
      return value === null || value === undefined ? "" : formatMoney(value);
    }

    function openAccountForm(account = null) {
      const editing = Boolean(account);
      const initialDate = account?.dueDate || dateForMonth(state.selectedMonth, Math.min(localToday().getDate(), 28));
      openModal(`
        ${closeButton()}
        <h2 class="modal-title" id="modalTitle">${editing ? "Editar conta" : "Nova conta"}</h2>
        <form id="accountForm" data-edit-id="${account?.id || ""}">
          <div class="form-grid">
            <div class="field full">
              <label for="accountName">Nome da conta</label>
              <input id="accountName" name="name" type="text" maxlength="80" placeholder="Ex: Conta de Luz" value="${escapeHTML(account?.name || "")}" required autofocus autocomplete="off">
            </div>
            <div class="field">
              <label for="accountValue">Valor (opcional)</label>
              <input id="accountValue" name="value" type="text" inputmode="numeric" placeholder="R$ 0,00" value="${currencyFieldValue(account?.value)}" data-currency data-cents="${account?.value ?? ""}" autocomplete="off">
              <p class="form-hint">Deixe vazio para usar como lembrete.</p>
            </div>
            <div class="field">
              <label for="accountDue">Vencimento</label>
              <input id="accountDue" name="dueDate" type="date" value="${initialDate}" required>
            </div>
            <div class="field full">
              <label for="accountNote">Observação</label>
              <textarea id="accountNote" name="note" maxlength="180" placeholder="Opcional">${escapeHTML(account?.note || "")}</textarea>
            </div>
          </div>
          <div class="modal-actions">
            <button class="modal-primary" type="submit">${editing ? "Salvar alterações" : "Adicionar"}</button>
            <button class="modal-plain" type="button" data-action="close-modal">Cancelar</button>
          </div>
        </form>`);
    }

    function openTemplateForm(template = null) {
      const editing = Boolean(template);
      openModal(`
        ${closeButton()}
        <h2 class="modal-title" id="modalTitle">${editing ? "Editar conta recorrente" : "Nova conta recorrente"}</h2>
        <form id="templateForm" data-edit-id="${template?.id || ""}">
          <div class="form-grid">
            <div class="field full">
              <label for="templateName">Nome</label>
              <input id="templateName" name="name" type="text" maxlength="80" placeholder="Ex: Conta de água" value="${escapeHTML(template?.name || "")}" required autofocus autocomplete="off">
            </div>
            <div class="field">
              <label for="templateValue">Valor padrão (opcional)</label>
              <input id="templateValue" name="value" type="text" inputmode="numeric" placeholder="R$ 0,00" value="${currencyFieldValue(template?.value)}" data-currency data-cents="${template?.value ?? ""}" autocomplete="off">
            </div>
            <div class="field">
              <label for="templateDay">Dia de vencimento</label>
              <input id="templateDay" name="dueDay" type="number" min="1" max="31" inputmode="numeric" placeholder="Ex: 10" value="${template?.dueDay || ""}" required>
            </div>
            <div class="field full">
              <label for="templateNote">Observação</label>
              <textarea id="templateNote" name="note" maxlength="180" placeholder="Opcional">${escapeHTML(template?.note || "")}</textarea>
            </div>
          </div>
          <div class="modal-actions">
            <button class="modal-primary" type="submit">${editing ? "Salvar alterações" : "Adicionar"}</button>
            <button class="modal-plain" type="button" data-action="close-modal">Cancelar</button>
          </div>
        </form>`);
    }

    function openDeleteModal(kind, id) {
      const collection = kind === "account" ? state.accounts : state.templates;
      const item = collection.find(entry => entry.id === id);
      if (!item) return;
      openModal(`
        <h2 class="modal-title" id="modalTitle">Excluir conta</h2>
        <p class="modal-copy">Deseja realmente excluir "${escapeHTML(item.name)}"? Esta ação não pode ser desfeita.</p>
        <div class="modal-actions">
          <button class="modal-danger" type="button" data-action="confirm-delete" data-kind="${kind}" data-id="${id}">Excluir</button>
          <button class="modal-secondary" type="button" data-action="close-modal">Cancelar</button>
        </div>`, { small: true });
    }

    function openPaymentModal(account) {
      const valueOption = account.value !== null && account.value !== undefined
        ? `<label class="check-option"><input type="checkbox" id="repeatValue" checked> Repetir o valor atual de ${formatMoney(account.value)}</label>` : "";
      openModal(`
        ${closeButton()}
        <h2 class="modal-title" id="modalTitle">Conta paga</h2>
        <p class="modal-copy">Deseja agendar esta conta automaticamente para o próximo mês?</p>
        ${valueOption}
        <div class="modal-actions">
          <button class="modal-primary" type="button" data-action="schedule-next" data-id="${account.id}">Agendar próximo mês</button>
          <button class="modal-secondary" type="button" data-action="close-modal">Agora não</button>
        </div>`, { small: true });
    }

    function openMonthPicker() {
      const { year, month } = parseMonthKey(state.selectedMonth);
      const years = Array.from({ length: 21 }, (_, index) => year - 10 + index);
      openModal(`
        ${closeButton()}
        <h2 class="modal-title" id="modalTitle">Selecionar período</h2>
        <form id="monthPickerForm">
          <div class="month-picker-grid">
            <div class="field">
              <label for="pickerMonth">Mês</label>
              <select id="pickerMonth" name="month" autofocus>${monthNames.map((name, index) => `<option value="${index + 1}" ${index + 1 === month ? "selected" : ""}>${name}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label for="pickerYear">Ano</label>
              <select id="pickerYear" name="year">${years.map(item => `<option value="${item}" ${item === year ? "selected" : ""}>${item}</option>`).join("")}</select>
            </div>
          </div>
          <div class="modal-actions">
            <button class="modal-primary" type="submit">Exibir contas</button>
            <button class="modal-plain" type="button" data-action="close-modal">Cancelar</button>
          </div>
        </form>`, { small: true });
    }

    function notificationStatus() {
      if (!("Notification" in window)) return { text: "Indisponível", className: "error" };
      if (Notification.permission === "granted") return { text: "Ativado", className: "online" };
      if (Notification.permission === "denied") return { text: "Bloqueado", className: "error" };
      return { text: "Desativado", className: "" };
    }

    function firestoreStatus() {
      const map = {
        local: { text: "Modo local", className: "" },
        connecting: { text: "Conectando", className: "" },
        connected: { text: "Sincronizado", className: "online" },
        error: { text: "Falha na conexão", className: "error" }
      };
      return map[cloudStatus];
    }

    function openSettings() {
      const notifications = notificationStatus();
      const firestore = firestoreStatus();
      const installRow = installPrompt ? `
        <div class="setting-row">
          <div class="setting-icon">${icon("download")}</div>
          <div><p class="setting-title">Instalar aplicativo</p><p class="setting-copy">Adicione o FinControl à tela inicial.</p></div>
          <button class="compact-primary" type="button" data-action="install-app">Instalar</button>
        </div>` : "";
      openModal(`
        ${closeButton()}
        <h2 class="modal-title" id="modalTitle">Configurações</h2>
        <div class="settings-list">
          <div class="setting-row">
            <div class="setting-icon">${icon("bell")}</div>
            <div><p class="setting-title">Alertas de vencimento</p><p class="setting-copy">Avisos 3 dias e 1 dia antes, verificados quando o app está aberto ou é retomado.</p></div>
            ${("Notification" in window) && Notification.permission === "default" ? `<button class="compact-primary" type="button" data-action="enable-notifications">Ativar</button>` : `<span class="setting-status ${notifications.className}">${notifications.text}</span>`}
          </div>
          <div class="setting-row">
            <div class="setting-icon">${icon("cloud")}</div>
            <div><p class="setting-title">Sincronização Firestore</p><p class="setting-copy">Preencha o bloco firebaseConfig no início do script para conectar a nuvem.</p></div>
            <span class="setting-status ${firestore.className}">${firestore.text}</span>
          </div>
          ${installRow}
        </div>`, { small: true });
    }

    function showToast(message, type = "") {
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toastRegion.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 190);
      }, 3200);
    }

    function generateTemplatesForMonth() {
      let created = 0;
      state.templates.forEach(template => {
        const alreadyExists = state.accounts.some(account =>
          account.recurringId === template.id && account.dueDate.startsWith(state.selectedMonth)
        );
        if (alreadyExists) return;
        state.accounts.push({
          id: uid("account"),
          recurringId: template.id,
          name: template.name,
          value: template.value ?? null,
          dueDate: dateForMonth(state.selectedMonth, template.dueDay),
          note: template.note || "",
          paid: false,
          createdAt: Date.now() + created
        });
        created += 1;
      });
      if (!created) {
        showToast("Todas as contas recorrentes já existem neste mês.");
        return;
      }
      persist();
      render();
      showToast(`${created} ${created === 1 ? "conta criada" : "contas criadas"} para ${monthTitle(state.selectedMonth)}.`, "success");
    }

    function submitAccountForm(form) {
      const data = new FormData(form);
      const editId = form.dataset.editId;
      const currency = form.querySelector("[data-currency]");
      const accountData = {
        name: String(data.get("name")).trim(),
        value: currency.dataset.cents === "" ? null : Number(currency.dataset.cents),
        dueDate: String(data.get("dueDate")),
        note: String(data.get("note")).trim()
      };
      if (!accountData.name || !accountData.dueDate) return;

      if (editId) {
        const index = state.accounts.findIndex(item => item.id === editId);
        if (index >= 0) state.accounts[index] = { ...state.accounts[index], ...accountData };
        showToast("Conta atualizada.", "success");
      } else {
        state.accounts.push({ ...accountData, id: uid("account"), recurringId: null, paid: false, createdAt: Date.now() });
        state.selectedMonth = accountData.dueDate.slice(0, 7);
        showToast("Conta adicionada.", "success");
      }
      persist();
      closeModal();
      render();
    }

    function submitTemplateForm(form) {
      const data = new FormData(form);
      const editId = form.dataset.editId;
      const currency = form.querySelector("[data-currency]");
      const dueDay = Math.min(Math.max(Number(data.get("dueDay")), 1), 31);
      const templateData = {
        name: String(data.get("name")).trim(),
        value: currency.dataset.cents === "" ? null : Number(currency.dataset.cents),
        dueDay,
        note: String(data.get("note")).trim()
      };
      if (!templateData.name || !dueDay) return;

      if (editId) {
        const index = state.templates.findIndex(item => item.id === editId);
        if (index >= 0) state.templates[index] = { ...state.templates[index], ...templateData };
        showToast("Conta recorrente atualizada.", "success");
      } else {
        const template = { ...templateData, id: uid("recurring") };
        state.templates.push(template);
        const existsInMonth = state.accounts.some(account => account.recurringId === template.id && account.dueDate.startsWith(state.selectedMonth));
        if (!existsInMonth) {
          state.accounts.push({
            id: uid("account"),
            recurringId: template.id,
            name: template.name,
            value: template.value,
            dueDate: dateForMonth(state.selectedMonth, template.dueDay),
            note: template.note,
            paid: false,
            createdAt: Date.now()
          });
        }
        showToast("Conta recorrente adicionada ao mês atual.", "success");
      }
      persist();
      closeModal();
      render();
    }

    function confirmDelete(kind, id) {
      if (kind === "account") state.accounts = state.accounts.filter(item => item.id !== id);
      else state.templates = state.templates.filter(item => item.id !== id);
      persist();
      closeModal();
      render();
      showToast("Conta excluída.");
    }

    function payAccount(id) {
      const account = state.accounts.find(item => item.id === id);
      if (!account) return;
      account.paid = true;
      account.paidAt = Date.now();
      persist();
      render();
      openPaymentModal(account);
    }

    function undoPayment(id) {
      const account = state.accounts.find(item => item.id === id);
      if (!account) return;
      account.paid = false;
      delete account.paidAt;
      persist();
      render();
      showToast("Pagamento desfeito.");
    }

    function scheduleNextMonth(id) {
      const source = state.accounts.find(item => item.id === id);
      if (!source) return;
      const nextMonth = shiftMonth(source.dueDate.slice(0, 7), 1);
      const dueDay = parseLocalDate(source.dueDate).getDate();
      const duplicate = state.accounts.some(item =>
        item.dueDate.startsWith(nextMonth) &&
        ((source.recurringId && item.recurringId === source.recurringId) || (!source.recurringId && item.name.toLowerCase() === source.name.toLowerCase()))
      );
      if (duplicate) {
        closeModal();
        showToast("Esta conta já está agendada para o próximo mês.");
        return;
      }
      const repeatValue = document.getElementById("repeatValue");
      state.accounts.push({
        id: uid("account"),
        recurringId: source.recurringId || null,
        sourceId: source.id,
        name: source.name,
        value: repeatValue && !repeatValue.checked ? null : source.value,
        dueDate: dateForMonth(nextMonth, dueDay),
        note: source.note || "",
        paid: false,
        createdAt: Date.now()
      });
      persist();
      closeModal();
      showToast(`Conta agendada para ${monthTitle(nextMonth)}.`, "success");
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        showToast("Este navegador não oferece suporte a notificações.", "error");
        return;
      }
      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          showToast("Alertas de vencimento ativados.", "success");
          checkDueNotifications();
        } else {
          showToast("Permissão de notificações não concedida.");
        }
        closeModal();
      } catch (error) {
        showToast("Não foi possível ativar as notificações.", "error");
      }
    }

    function checkDueNotifications() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const today = localToday();
      let changed = false;
      state.accounts.filter(account => !account.paid).forEach(account => {
        const due = parseLocalDate(account.dueDate);
        const days = Math.round((due - today) / 86400000);
        if (days !== 3 && days !== 1) return;
        const notificationKey = `${account.id}-${account.dueDate}-${days}`;
        if (state.notificationSent[notificationKey]) return;
        const title = days === 1 ? "Conta vence amanhã" : "Conta vence em 3 dias";
        const value = formatMoney(account.value);
        new Notification(title, {
          body: `${account.name} vence em ${formatDue(account.dueDate)}${value ? ` no valor de ${value}` : ""}.`,
          icon: document.querySelector('link[rel="apple-touch-icon"]')?.href,
          tag: notificationKey
        });
        state.notificationSent[notificationKey] = Date.now();
        changed = true;
      });
      if (changed) persist();
    }

    function handleCurrencyInput(input) {
      const digits = input.value.replace(/\D/g, "");
      if (!digits) {
        input.value = "";
        input.dataset.cents = "";
        return;
      }
      const cents = Math.min(Number(digits), 99999999999);
      input.dataset.cents = String(cents);
      input.value = formatMoney(cents);
    }

    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-nav]");
      if (nav) {
        activePage = nav.dataset.nav;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const button = event.target.closest("[data-action]");
      if (!button) return;
      const { action, id, kind } = button.dataset;
      if (action === "previous-month" || action === "next-month") {
        state.selectedMonth = shiftMonth(state.selectedMonth, action === "next-month" ? 1 : -1);
        persist();
        render();
      } else if (action === "open-month-picker") openMonthPicker();
      else if (action === "new-account") openAccountForm();
      else if (action === "edit-account") openAccountForm(state.accounts.find(item => item.id === id));
      else if (action === "delete-account") openDeleteModal("account", id);
      else if (action === "new-template") openTemplateForm();
      else if (action === "edit-template") openTemplateForm(state.templates.find(item => item.id === id));
      else if (action === "delete-template") openDeleteModal("template", id);
      else if (action === "confirm-delete") confirmDelete(kind, id);
      else if (action === "pay") payAccount(id);
      else if (action === "undo-payment") undoPayment(id);
      else if (action === "schedule-next") scheduleNextMonth(id);
      else if (action === "generate-templates") generateTemplatesForMonth();
      else if (action === "open-settings") openSettings();
      else if (action === "close-modal") closeModal();
      else if (action === "enable-notifications") enableNotifications();
      else if (action === "install-app" && installPrompt) {
        installPrompt.prompt();
        installPrompt.userChoice.finally(() => { installPrompt = null; closeModal(); });
      }
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      if (event.target.id === "accountForm") submitAccountForm(event.target);
      else if (event.target.id === "templateForm") submitTemplateForm(event.target);
      else if (event.target.id === "monthPickerForm") {
        const data = new FormData(event.target);
        state.selectedMonth = `${data.get("year")}-${String(data.get("month")).padStart(2, "0")}`;
        persist();
        closeModal();
        activePage = "month";
        render();
      }
    });

    document.addEventListener("input", event => {
      if (event.target.matches("[data-currency]")) handleCurrencyInput(event.target);
    });

    document.addEventListener("focusin", event => {
      if (event.target.matches("[data-currency]") && event.target.value) {
        requestAnimationFrame(() => event.target.select());
      }
    });

    modalLayer.addEventListener("click", event => {
      if (event.target === modalLayer) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !modalLayer.hidden) closeModal();
      if (event.key === "Tab" && !modalLayer.hidden) {
        const focusable = [...modalPanel.querySelectorAll("button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])")];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") checkDueNotifications();
    });

    render();
    initializeFirestore();
    checkDueNotifications();
    setInterval(checkDueNotifications, 30 * 60 * 1000);
  </script>
</body>
</html>
