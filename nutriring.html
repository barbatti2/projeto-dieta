<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>NutriRing — Diário Alimentar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A;
    --surface:#131829;
    --surface-2:#1B2238;
    --surface-3:#232C48;
    --border:#262F4A;
    --text:#F3F5FB;
    --text-muted:#8A93B2;
    --text-dim:#5C6584;
    --accent-1:#17E3B0;
    --accent-2:#2F6BFF;
    --success:#3ddc84;
    --warning:#ffc168;
    --danger:#ff5c72;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --shadow-card: 0 10px 30px -12px rgba(0,0,0,.55);
  }
  [data-profile="raissa"]{
    --accent-1:#FF7AA8;
    --accent-2:#FFC168;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent-1) 18%, transparent), transparent 45%),
      radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background .6s ease;
  }
  #app{max-width:640px;margin:0 auto;padding:0 0 100px 0;min-height:100vh;position:relative;}

  /* ---------- HEADER ---------- */
  .app-header{
    padding:22px 20px 18px 20px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(10,14,26,.97) 70%, rgba(10,14,26,0));
    backdrop-filter:blur(10px);
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-mark{
    width:44px; height:44px; border-radius:14px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    font-size:20px; font-weight:800; color:#0A0E1A; font-family:var(--font-display);
    box-shadow:0 6px 18px -6px var(--accent-2);
    transition:background .6s ease;
  }
  .brand-text{min-width:0;}
  .brand-text h1{
    font-family:var(--font-display); font-size:21px; font-weight:700; margin:0 0 2px 0;
    letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-text p{margin:0; font-size:12.5px; color:var(--text-muted);}
  .profile-switch{
    display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; flex:none;
  }
  .profile-btn{
    border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-weight:600;
    font-size:12.5px; padding:8px 13px; border-radius:999px; cursor:pointer; transition:all .25s ease;
  }
  .profile-btn.active{
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A;
    box-shadow:0 4px 14px -4px var(--accent-2);
  }

  /* ---------- TAB NAV ---------- */
  .tab-nav{
    display:flex; gap:6px; padding:0 14px 10px 14px; overflow-x:auto; scrollbar-width:none;
  }
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    font-family:var(--font-body); font-weight:600; font-size:13px; padding:9px 14px; border-radius:12px; cursor:pointer;
    transition:all .2s ease; white-space:nowrap;
  }
  .tab-btn.active{
    color:#0A0E1A; border-color:transparent;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
  }

  main#content{padding:6px 16px 30px 16px; display:flex; flex-direction:column; gap:16px;}

  /* ---------- CARDS ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; box-shadow:var(--shadow-card);
  }
  .card h2{font-family:var(--font-display); font-size:15px; margin:0 0 12px 0; letter-spacing:-.01em;}
  .field-label{display:block; font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}

  /* ---------- HOME RING ---------- */
  .ring-section{display:flex; flex-direction:column; align-items:center; padding:26px 18px;}
  .ring-outer{position:relative; width:220px; height:220px;}
  .ring-glow{
    position:absolute; inset:8px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); filter:blur(26px); opacity:.35;
  }
  .ring-fill{
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2) var(--pct-deg, 0deg), var(--surface-3) var(--pct-deg, 0deg) 360deg);
    transition:background 1.1s cubic-bezier(.4,0,.2,1);
  }
  .ring-inner{
    position:absolute; inset:16px; border-radius:50%; background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border:1px solid var(--border);
  }
  .ring-inner .kcal-num{font-family:var(--font-mono); font-size:30px; font-weight:700; line-height:1;}
  .ring-inner .kcal-goal{font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); margin-top:4px;}
  .ring-inner .kcal-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:6px;}
  .ring-caption{margin-top:16px; font-size:13px; color:var(--text-muted); text-align:center;}

  .macro-cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .macro-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 10px;
    text-align:center; display:flex; flex-direction:column; gap:6px;
  }
  .macro-card .macro-icon{font-size:18px;}
  .macro-card .macro-val{font-family:var(--font-mono); font-size:19px; font-weight:700;}
  .macro-card .macro-name{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
  .macro-bar{height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-top:2px;}
  .macro-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition:width 1s ease;}

  /* ---------- BUTTONS ---------- */
  .btn-primary, .btn-gradient, .btn-outline{
    border:none; cursor:pointer; font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:13px 18px; border-radius:13px; transition:transform .15s ease, opacity .2s ease;
  }
  .btn-primary{background:var(--surface-3); color:var(--text); border:1px solid var(--border);}
  .btn-gradient{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A;}
  .btn-outline{background:transparent; color:var(--accent-1); border:1px solid var(--border);}
  .btn-primary:active, .btn-gradient:active, .btn-outline:active{transform:scale(.97);}
  .full{width:100%; margin-top:6px;}
  .btn-small{padding:8px 12px; font-size:12.5px; border-radius:10px;}

  /* ---------- SEARCH / DROPDOWN ---------- */
  .search-wrap{position:relative;}
  #foodSearchInput{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-family:var(--font-body); font-size:14.5px; padding:13px 14px; border-radius:13px; outline:none;
  }
  #foodSearchInput:focus{border-color:var(--accent-1);}
  .dropdown{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface-2);
    border:1px solid var(--border); border-radius:13px; max-height:280px; overflow-y:auto; z-index:15;
    box-shadow:var(--shadow-card);
  }
  .dropdown.hidden{display:none;}
  .dropdown-item{padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover, .dropdown-item:active{background:var(--surface-3);}
  .dropdown-item .di-name{font-size:13.5px;}
  .dropdown-item .di-cat{font-size:10.5px; color:var(--text-dim); flex:none;}
  .dropdown-empty{padding:14px; font-size:13px; color:var(--text-muted); text-align:center;}

  .selected-food{margin-top:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:14px;}
  .selected-food.hidden{display:none;}
  .selected-food .sf-name{font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:8px;}
  .sf-macros{display:flex; gap:14px; flex-wrap:wrap;}
  .sf-macros span{font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted);}
  .sf-macros b{color:var(--text); font-weight:600;}

  /* ---------- STEPPER ---------- */
  .stepper{display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:12px;}
  .stepper-btn{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:22px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper-btn:active{transform:scale(.93);}
  .stepper-value{font-family:var(--font-mono); font-size:26px; font-weight:700; min-width:90px; text-align:center;}
  .quick-grams{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .quick-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-family:var(--font-mono);
    font-weight:600; font-size:12.5px; padding:10px 4px; border-radius:10px; cursor:pointer;
  }
  .quick-btn.active{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A; border-color:transparent;}

  /* ---------- MEAL TYPE ---------- */
  .meal-type-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .meal-type-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-family:var(--font-body);
    font-weight:600; font-size:13px; padding:12px 8px; border-radius:12px; cursor:pointer;
  }
  .meal-type-btn.active{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A; border-color:transparent;}

  /* ---------- ITEMS LIST ---------- */
  .items-list{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:10px 0;}
  .item-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:12px; padding:11px 13px;
  }
  .item-row .ir-info{min-width:0;}
  .item-row .ir-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;}
  .item-row .ir-sub{font-size:11.5px; color:var(--text-muted); font-family:var(--font-mono);}
  .item-row .ir-remove{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; flex:none;}

  /* ---------- CALENDAR ---------- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-nav-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:16px;}
  .cal-month-label{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .cal-clock{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); text-align:center; margin-bottom:12px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-dim); font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:13px;
    background:var(--surface-2); border:1px solid transparent; cursor:pointer; position:relative; font-family:var(--font-mono);
  }
  .cal-day.empty{background:transparent; cursor:default;}
  .cal-day.today{border-color:var(--accent-1); animation:pulseToday 1.6s ease-in-out infinite;}
  .cal-day .dot{position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%;}
  @keyframes pulseToday{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-1) 55%, transparent);}
    50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--accent-1) 0%, transparent);}
  }
  .mark-dieta_treino{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A; font-weight:700;}
  .mark-dieta{background:color-mix(in srgb, var(--accent-1) 30%, var(--surface-2)); }
  .mark-treino{background:color-mix(in srgb, var(--warning) 30%, var(--surface-2));}
  .cal-legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:16px;}
  .legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted);}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .cal-counters{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:6px;}
  .counter-card{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;}
  .counter-card .cc-num{font-family:var(--font-mono); font-size:22px; font-weight:700;}
  .counter-card .cc-label{font-size:10.5px; color:var(--text-muted); margin-top:3px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,16,.72); backdrop-filter:blur(4px); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:var(--surface); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%; max-width:640px;
    padding:22px 20px 28px 20px; animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-box h3{font-family:var(--font-display); font-size:17px; margin:0 0 16px 0;}
  .modal-options{display:flex; flex-direction:column; gap:10px;}
  .modal-opt-btn{
    text-align:left; padding:14px 16px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer;
  }
  .modal-opt-btn.remove{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 30%, var(--border));}
  .modal-close{margin-top:14px; width:100%; text-align:center; background:transparent; border:none; color:var(--text-muted); font-size:13px; padding:8px; cursor:pointer;}

  /* ---------- HISTORICO ---------- */
  .filter-segment{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:16px;}
  .seg-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-weight:600; font-size:12.5px; padding:10px 4px; border-radius:11px; cursor:pointer;}
  .seg-btn.active{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#0A0E1A; border-color:transparent;}
  .hist-day-group{margin-bottom:16px;}
  .hist-date-title{font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:8px; color:var(--text);}
  .hist-meal-group{margin-bottom:10px;}
  .hist-meal-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; margin-bottom:6px;}
  .hist-item{display:flex; justify-content:space-between; font-size:13px; padding:8px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:5px;}
  .hist-item .hi-sub{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted);}
  .hist-day-total{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); margin-top:2px;}

  /* ---------- PESOS ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field label{font-size:11.5px; color:var(--text-muted); font-weight:600;}
  .form-field input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:var(--font-mono);
    font-size:15px; padding:11px 12px; border-radius:11px; outline:none; width:100%;
  }
  .form-field input:focus{border-color:var(--accent-1);}
  .goal-summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .goal-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:12px; text-align:center;}
  .goal-chip .gc-val{font-family:var(--font-mono); font-size:17px; font-weight:700;}
  .goal-chip .gc-label{font-size:10.5px; color:var(--text-muted); margin-top:3px;}
  .progress-capsule{height:22px; border-radius:99px; background:var(--surface-3); overflow:hidden; border:1px solid var(--border); position:relative;}
  .progress-capsule-fill{
    height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    transition:width 1s cubic-bezier(.4,0,.2,1); display:flex; align-items:center; justify-content:flex-end;
  }
  .progress-capsule-fill span{font-family:var(--font-mono); font-size:10.5px; color:#0A0E1A; font-weight:700; padding-right:8px;}
  .weight-history-list{display:flex; flex-direction:column; gap:7px; margin-top:12px; max-height:220px; overflow-y:auto;}
  .wh-row{display:flex; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px;}
  .wh-row .wh-val{font-family:var(--font-mono); font-weight:700;}
  .inline-row{display:flex; gap:10px; align-items:flex-end;}
  .inline-row .form-field{flex:1;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); background:var(--surface-3); border:1px solid var(--border);
    color:var(--text); padding:12px 18px; border-radius:13px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:all .3s ease; z-index:200; box-shadow:var(--shadow-card); max-width:90%; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  .loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:300;
  }
  .loading-ring{width:50px; height:50px; border-radius:50%; border:4px solid var(--surface-3); border-top-color:var(--accent-1); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen p{color:var(--text-muted); font-size:13px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent-1); outline-offset:2px;}

  @media (max-width:380px){
    .ring-outer{width:190px; height:190px;}
    .macro-card .macro-val{font-size:16px;}
  }
</style>
</head>
<body data-profile="gabriel">
<div id="loadingScreen" class="loading-screen"><div class="loading-ring"></div><p>Carregando seu diário...</p></div>

<div id="app" style="display:none;">
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">◆</div>
        <div class="brand-text">
          <h1 id="pageTitle">Início</h1>
          <p id="pageSubtitle">Resumo de hoje</p>
        </div>
      </div>
      <div class="profile-switch" id="profileSwitch">
        <button class="profile-btn active" data-profile="gabriel">Gabriel</button>
        <button class="profile-btn" data-profile="raissa">Raissa</button>
      </div>
    </div>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="inicio">🏠 Início</button>
    <button class="tab-btn" data-tab="adicionar">➕ Adicionar</button>
    <button class="tab-btn" data-tab="calendario">📅 Calendário</button>
    <button class="tab-btn" data-tab="historico">📜 Histórico</button>
    <button class="tab-btn" data-tab="pesos">⚖️ Pesos</button>
  </nav>

  <main id="content"></main>
</div>

<div id="toast" class="toast"></div>
<div id="modalOverlay" class="modal-overlay hidden"><div id="modalBox" class="modal-box"></div></div>

<script>
/* ============================================================
   NUTRIRING — APP LOGIC
   ============================================================ */

/* ---------- helpers ---------- */
function normalize(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function todayStr(){
  return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
}
function nowBRTime(){

/* ---------- food database (500+ items) ---------- */
function seedRand(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return ((h>>>0) % 100000) / 100000;
}
function macroFor(name, kR, pR, cR, fR){
  const r1=seedRand(name+'#k'), r2=seedRand(name+'#p'), r3=seedRand(name+'#c'), r4=seedRand(name+'#f');
  return {
    kcal: Math.round(kR[0] + r1*(kR[1]-kR[0])),
    protein: Math.round((pR[0] + r2*(pR[1]-pR[0]))*10)/10,
    carbs: Math.round((cR[0] + r3*(cR[1]-cR[0]))*10)/10,
    fat: Math.round((fR[0] + r4*(fR[1]-fR[0]))*10)/10
  };
}

function renderInicio(){
  const today = todayStr();
  const meals = state.meals.filter(m=>m.date===today);
  const sum = meals.reduce((a,m)=>({kcal:a.kcal+m.kcal, protein:a.protein+m.protein, carbs:a.carbs+m.carbs, fat:a.fat+m.fat}), {kcal:0,protein:0,carbs:0,fat:0});
  const goals = state.goals;
  const pct = clamp(goals.calorias>0 ? (sum.kcal/goals.calorias*100) : 0, 0, 100);
  const pctDeg = (pct*3.6).toFixed(1)+'deg';

  const remProtein = Math.max(0, Math.round(goals.proteina - sum.protein));
  const remKcal = Math.max(0, Math.round(goals.calorias - sum.kcal));
  const remCarbs = Math.max(0, Math.round(goals.carboidratos - sum.carbs));
  const pctProtein = clamp(goals.proteina>0 ? sum.protein/goals.proteina*100:0,0,100);
  const pctCarbs = clamp(goals.carboidratos>0 ? sum.carbs/goals.carboidratos*100:0,0,100);
  const pctKcal = pct;

  return `
    <section class="card ring-section">
      <div class="ring-outer">
        <div class="ring-glow"></div>
        <div class="ring-fill" style="--pct-deg:${pctDeg}"></div>
        <div class="ring-inner">
          <div class="kcal-num">${Math.round(sum.kcal)}</div>
          <div class="kcal-goal">de ${goals.calorias} kcal</div>
          <div class="kcal-label">consumidas hoje</div>
        </div>
      </div>
      <p class="ring-caption">${meals.length} ${meals.length===1?'item registrado':'itens registrados'} hoje · ${PROFILE_NAMES[currentProfile]}</p>
    </section>

    <section class="macro-cards">
      <div class="macro-card">
        <span class="macro-icon">🥩</span>
        <span class="macro-val">${remProtein}g</span>
        <span class="macro-name">Proteína faltando</span>
        <div class="macro-bar"><div class="macro-bar-fill" style="width:${pctProtein}%"></div></div>
      </div>
      <div class="macro-card">
        <span class="macro-icon">🔥</span>
        <span class="macro-val">${remKcal}</span>
        <span class="macro-name">Calorias faltando</span>
        <div class="macro-bar"><div class="macro-bar-fill" style="width:${pctKcal}%"></div></div>
      </div>
      <div class="macro-card">
        <span class="macro-icon">🌾</span>
        <span class="macro-val">${remCarbs}g</span>
        <span class="macro-name">Carbos faltando</span>
        <div class="macro-bar"><div class="macro-bar-fill" style="width:${pctCarbs}%"></div></div>
      </div>
    </section>

    <section class="card">
      <h2>Refeições de hoje</h2>
      ${meals.length===0 ? '<p class="empty-hint">Nenhum alimento registrado ainda. Vá até "Adicionar" para começar.</p>' :
        Object.keys(MEAL_LABELS).map(mt=>{
          const items = meals.filter(m=>m.mealType===mt);
          if(items.length===0) return '';
          const tot = items.reduce((a,i)=>a+i.kcal,0);
          return `<div class="hist-meal-group">
            <div class="hist-meal-title">${MEAL_LABELS[mt]} · ${Math.round(tot)} kcal</div>
            ${items.map(i=>`<div class="hist-item"><span>${i.name}</span><span class="hi-sub">${i.grams}g · ${Math.round(i.kcal)}kcal</span></div>`).join('')}
          </div>`;
        }).join('')
      }
    </section>
  `;
}

function wireAdicionar(){
  const searchInput = document.getElementById('foodSearchInput');
  const dropdown = document.getElementById('foodDropdown');
  const selectedBox = document.getElementById('selectedFoodBox');

  function updateSelectedBox(){
    if(addFoodState.selected){
      selectedBox.classList.remove('hidden');
      selectedBox.innerHTML = renderSelectedFoodBoxHTML();
    } else {
      selectedBox.classList.add('hidden');
      selectedBox.innerHTML = '';
    }
  }
  updateSelectedBox();

  searchInput.addEventListener('input', ()=>{
    const q = normalize(searchInput.value.trim());
    if(q.length===0){ dropdown.classList.add('hidden'); dropdown.innerHTML=''; return; }
    const results = FOOD_DB.filter(f=>normalize(f.name).includes(q)).slice(0,8);
    if(results.length===0){
      dropdown.innerHTML = '<div class="dropdown-empty">Nenhum alimento encontrado</div>';
    } else {
      dropdown.innerHTML = results.map(f=>`<div class="dropdown-item" data-food-id="${f.id}"><span class="di-name">${f.name}</span><span class="di-cat">${f.category}</span></div>`).join('');
    }
    dropdown.classList.remove('hidden');
  });
  dropdown.addEventListener('click', (e)=>{
    const item = e.target.closest('.dropdown-item');
    if(!item) return;
    const id = parseInt(item.dataset.foodId,10);
    const food = FOOD_DB.find(f=>f.id===id);
    if(food){
      addFoodState.selected = food;
      searchInput.value = food.name;
      dropdown.classList.add('hidden');
      updateSelectedBox();
    }
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) dropdown.classList.add('hidden');
  });

  const gramsValueEl = document.getElementById('gramsValue');
  function setGrams(v){
    addFoodState.grams = clamp(v, 10, 2000);
    gramsValueEl.textContent = addFoodState.grams+'g';
    document.querySelectorAll('#quickGrams .quick-btn').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.grams,10)===addFoodState.grams));
    updateSelectedBox();
  }
  document.getElementById('gramsMinus').addEventListener('click', ()=>setGrams(addFoodState.grams-10));
  document.getElementById('gramsPlus').addEventListener('click', ()=>setGrams(addFoodState.grams+10));
  document.getElementById('quickGrams').addEventListener('click', (e)=>{
    const btn = e.target.closest('.quick-btn');
    if(!btn) return;
    setGrams(parseInt(btn.dataset.grams,10));
  });

  document.getElementById('mealTypeGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('.meal-type-btn');
    if(!btn) return;
    addFoodState.mealType = btn.dataset.meal;
    document.querySelectorAll('.meal-type-btn').forEach(b=>b.classList.toggle('active', b.dataset.meal===addFoodState.mealType));
  });

  document.getElementById('includeItemBtn').addEventListener('click', ()=>{
    if(!addFoodState.selected){ showToast('Selecione um alimento primeiro'); return; }
    const f = addFoodState.selected;
    const factor = addFoodState.grams/100;
    addFoodState.itemsToSave.push({
      uid: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      name:f.name, grams:addFoodState.grams, mealType:addFoodState.mealType,
      kcal:f.kcal*factor, protein:f.protein*factor, carbs:f.carbs*factor, fat:f.fat*factor
    });
    document.getElementById('itemsList').innerHTML = renderItemsListHTML();
    showToast('Item incluído: '+f.name);
  });

  document.getElementById('itemsList').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-remove]');
    if(!btn) return;
    addFoodState.itemsToSave = addFoodState.itemsToSave.filter(it=>it.uid!==btn.dataset.remove);
    document.getElementById('itemsList').innerHTML = renderItemsListHTML();
  });

  document.getElementById('saveMealBtn').addEventListener('click', async ()=>{
    if(addFoodState.itemsToSave.length===0){ showToast('Inclua pelo menos um item'); return; }
    const today = todayStr();
    addFoodState.itemsToSave.forEach(it=>{
      state.meals.push({
        id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
        date: today, mealType: it.mealType, name: it.name, grams: it.grams,
        kcal: it.kcal, protein: it.protein, carbs: it.carbs, fat: it.fat
      });
    });
    addFoodState.itemsToSave = [];
    await saveState();
    document.getElementById('itemsList').innerHTML = renderItemsListHTML();
    showToast('Refeição salva com sucesso!');
  });
}

/* ============================================================
   TAB: CALENDÁRIO
   ============================================================ */
function renderCalendario(){
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthLabel = new Intl.DateTimeFormat('pt-BR', {month:'long', year:'numeric'}).format(calendarViewDate);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = dateStr===today;
    const mark = state.calendarMarks[dateStr];
    const markCls = mark ? MARK_INFO[mark].cls : '';
    cells += `<div class="cal-day ${isToday?'today':''} ${markCls}" data-date="${dateStr}">${d}</div>`;
  }

  const counts = {dieta_treino:0, dieta:0, treino:0};
  Object.keys(state.calendarMarks).forEach(dt=>{
    if(dt.startsWith(year+'-'+String(month+1).padStart(2,'0'))){
      counts[state.calendarMarks[dt]] = (counts[state.calendarMarks[dt]]||0)+1;
    }
  });

  return `
    <section class="card">
      <div class="cal-clock" id="brClock">Horário de Brasília: ${nowBRTime()}</div>
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev">‹</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="calNext">›</button>
      </div>
      <div class="cal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="cal-grid" id="calGrid">${cells}</div>
      <div class="cal-legend">
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,var(--accent-1),var(--accent-2))"></span>Dieta + Treino</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent-1)"></span>Só Dieta</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warning)"></span>Só Treino</div>
      </div>
    </section>
    <section class="cal-counters">
      <div class="counter-card"><div class="cc-num">${counts.dieta_treino}</div><div class="cc-label">Dieta + Treino</div></div>
      <div class="counter-card"><div class="cc-num">${counts.dieta}</div><div class="cc-label">Só Dieta</div></div>
      <div class="counter-card"><div class="cc-num">${counts.treino}</div><div class="cc-label">Só Treino</div></div>
    </section>
  `;
}
function wireCalendario(){
  clearInterval(window.__clockInterval);
  window.__clockInterval = setInterval(()=>{
    const el = document.getElementById('brClock');
    if(el) el.textContent = 'Horário de Brasília: '+nowBRTime();
    else clearInterval(window.__clockInterval);
  }, 1000);

  document.getElementById('calPrev').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()-1, 1);
    render();
  });
  document.getElementById('calNext').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 1);
    render();
  });
  document.getElementById('calGrid').addEventListener('click', (e)=>{
    const cell = e.target.closest('.cal-day');
    if(!cell || cell.classList.contains('empty')) return;
    openDayModal(cell.dataset.date);
  });
}
function openDayModal(dateStr){
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  const current = state.calendarMarks[dateStr];
  box.innerHTML = `
    <h3>${fmtDateLong(dateStr)}</h3>
    <div class="modal-options">
      <button class="modal-opt-btn" data-mark="dieta_treino">🏋️ Dieta + Treino</button>
      <button class="modal-opt-btn" data-mark="dieta">🥗 Só Dieta</button>
      <button class="modal-opt-btn" data-mark="treino">💪 Só Treino</button>
      ${current ? '<button class="modal-opt-btn remove" data-mark="__remove">🗑 Remover marcação</button>' : ''}
    </div>
    <button class="modal-close" id="modalCloseBtn">Cancelar</button>
  `;
  overlay.classList.remove('hidden');
  box.querySelectorAll('[data-mark]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const mk = btn.dataset.mark;
      if(mk==='__remove') delete state.calendarMarks[dateStr];
      else state.calendarMarks[dateStr] = mk;
      await saveState();
      overlay.classList.add('hidden');
      render();
    });
  });
  document.getElementById('modalCloseBtn').addEventListener('click', ()=>overlay.classList.add('hidden'));
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.add('hidden'); };
}

/* ============================================================
   TAB: HISTÓRICO
   ============================================================ */
function renderHistorico(){
  return `
    <section class="card">
      <div class="filter-segment" id="histFilter">
        <button class="seg-btn${historicoFilter==='dia'?' active':''}" data-filter="dia">Dia</button>
        <button class="seg-btn${historicoFilter==='semana'?' active':''}" data-filter="semana">Semana</button>
        <button class="seg-btn${historicoFilter==='mes'?' active':''}" data-filter="mes">Mês</button>
        <button class="seg-btn${historicoFilter==='ano'?' active':''}" data-filter="ano">Ano</button>
      </div>
      <div id="histContent">${renderHistContent()}</div>
    </section>
  `;
}
function renderHistContent(){
  const today = todayStr();
  if(historicoFilter==='ano'){
    const months = {};
    state.meals.forEach(m=>{
      if(m.date < addDays(today,-365)) return;
      const key = m.date.slice(0,7);
      if(!months[key]) months[key] = {kcal:0,count:0};
      months[key].kcal += m.kcal; months[key].count++;
    });
    const keys = Object.keys(months).sort().reverse();
    if(keys.length===0) return '<p class="empty-hint">Nenhum registro no último ano.</p>';
    return keys.map(k=>{
      const label = new Intl.DateTimeFormat('pt-BR',{month:'long', year:'numeric'}).format(new Date(k+'-15T12:00:00Z'));
      return `<div class="hist-day-group"><div class="hist-date-title">${label}</div><div class="hist-day-total">${months[k].count} itens · ${Math.round(months[k].kcal)} kcal totais</div></div>`;
    }).join('');
  }

  let startDate;
  if(historicoFilter==='dia') startDate = today;
  else if(historicoFilter==='semana') startDate = addDays(today,-6);
  else startDate = addDays(today,-29);

  const relevant = state.meals.filter(m=>m.date>=startDate && m.date<=today);
  if(relevant.length===0) return '<p class="empty-hint">Nenhum registro nesse período.</p>';

  const byDate = {};
  relevant.forEach(m=>{ if(!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });
  const dates = Object.keys(byDate).sort().reverse();

  return dates.map(dt=>{
    const items = byDate[dt];
    const total = items.reduce((a,i)=>a+i.kcal,0);
    const groups = Object.keys(MEAL_LABELS).map(mt=>{
      const mi = items.filter(i=>i.mealType===mt);
      if(mi.length===0) return '';
      return `<div class="hist-meal-group">
        <div class="hist-meal-title">${MEAL_LABELS[mt]}</div>
        ${mi.map(i=>`<div class="hist-item"><span>${i.name}</span><span class="hi-sub">${i.grams}g · ${Math.round(i.kcal)}kcal</span></div>`).join('')}
      </div>`;
    }).join('');
    return `<div class="hist-day-group">
      <div class="hist-date-title">${fmtDateLong(dt)}</div>
      <div class="hist-day-total">${Math.round(total)} kcal no dia</div>
      ${groups}
    </div>`;
  }).join('');
}
function wireHistorico(){
  document.getElementById('histFilter').addEventListener('click', (e)=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    historicoFilter = btn.dataset.filter;
    document.querySelectorAll('#histFilter .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.filter===historicoFilter));
    document.getElementById('histContent').innerHTML = renderHistContent();
  });
}

/* ============================================================
   TAB: PESOS E MEDIDAS
   ============================================================ */
function renderPesos(){
  const w = state.weight;
  const initial = w.initial;
  const lastEntry = w.history.length ? w.history[w.history.length-1] : null;
  const currentWeight = lastEntry ? lastEntry.peso : (initial ? initial.peso : null);

  let progressPct = 0, progressLabel = '—';
  if(initial && currentWeight!==null){
    const total = initial.pesoAlvo - initial.peso;
    if(total===0) progressPct = 100;
    else progressPct = clamp(((currentWeight-initial.peso)/total)*100, 0, 100);
    progressLabel = Math.round(progressPct)+'%';
  }

  return `
    <section class="card">
      <h2>Metas iniciais</h2>
      ${initial ? `
        <div class="goal-summary">
          <div class="goal-chip"><div class="gc-val">${initial.peso}kg</div><div class="gc-label">Peso inicial</div></div>
          <div class="goal-chip"><div class="gc-val">${initial.pesoAlvo}kg</div><div class="gc-label">Peso alvo</div></div>
          <div class="goal-chip"><div class="gc-val">${initial.cintura}cm</div><div class="gc-label">Cintura</div></div>
          <div class="goal-chip"><div class="gc-val">${initial.braco}cm</div><div class="gc-label">Braço</div></div>
        </div>
        <button class="btn-outline btn-small" id="editInitialBtn">Editar metas iniciais</button>
        <div id="initialFormWrap"></div>
      ` : `
        <div id="initialFormWrap">${renderInitialForm()}</div>
      `}
    </section>

    <section class="card">
      <h2>Progresso rumo à meta</h2>
      <div class="progress-capsule">
        <div class="progress-capsule-fill" style="width:${progressPct}%"><span>${progressLabel}</span></div>
      </div>
      <p class="ring-caption" style="margin-top:12px;">${currentWeight!==null ? 'Peso atual: '+currentWeight+'kg' : 'Registre seu peso inicial para começar'}</p>
    </section>

    <section class="card">
      <h2>Atualização semanal de peso</h2>
      <div class="inline-row">
        <div class="form-field">
          <label>Peso atual (kg)</label>
          <input type="number" id="newWeightInput" step="0.1" placeholder="Ex: 78.5">
        </div>
        <button class="btn-gradient btn-small" id="addWeightBtn">Registrar</button>
      </div>
      <div class="weight-history-list">
        ${w.history.length===0 ? '<p class="empty-hint">Nenhum registro ainda.</p>' :
          w.history.slice().reverse().map(h=>`<div class="wh-row"><span>${fmtDateShort(h.date)}</span><span class="wh-val">${h.peso}kg</span></div>`).join('')}
      </div>
    </section>

    <section class="card">
      <h2>Configuração de metas</h2>
      <div class="form-grid">
        <div class="form-field"><label>Meta de calorias (kcal)</label><input type="number" id="goalKcal" value="${state.goals.calorias}"></div>
        <div class="form-field"><label>Meta de proteína (g)</label><input type="number" id="goalProtein" value="${state.goals.proteina}"></div>
        <div class="form-field"><label>Meta de carboidratos (g)</label><input type="number" id="goalCarbs" value="${state.goals.carboidratos}"></div>
      </div>
      <button class="btn-gradient full" id="saveGoalsBtn">Salvar metas</button>
    </section>
  `;
}
function renderInitialForm(){
  return `
    <div class="form-grid">
      <div class="form-field"><label>Peso atual (kg)</label><input type="number" id="fPeso" step="0.1" placeholder="Ex: 82"></div>
      <div class="form-field"><label>Peso alvo (kg)</label><input type="number" id="fPesoAlvo" step="0.1" placeholder="Ex: 75"></div>
      <div class="form-field"><label>Cintura (cm)</label><input type="number" id="fCintura" step="0.1" placeholder="Ex: 88"></div>
      <div class="form-field"><label>Braço (cm)</label><input type="number" id="fBraco" step="0.1" placeholder="Ex: 34"></div>
    </div>
    <button class="btn-gradient full" id="saveInitialBtn">Salvar metas iniciais</button>
  `;
}
function wirePesos(){
  const editBtn = document.getElementById('editInitialBtn');
  if(editBtn){
    editBtn.addEventListener('click', ()=>{
      document.getElementById('initialFormWrap').innerHTML = renderInitialForm();
      wireInitialForm();
    });
  } else {
    wireInitialForm();
  }

  document.getElementById('addWeightBtn').addEventListener('click', async ()=>{
    const val = parseFloat(document.getElementById('newWeightInput').value);
    if(isNaN(val) || val<=0){ showToast('Informe um peso válido'); return; }
    const today = todayStr();
    const existingIdx = state.weight.history.findIndex(h=>h.date===today);
    if(existingIdx>=0) state.weight.history[existingIdx].peso = val;
    else state.weight.history.push({date:today, peso:val});
    state.weight.history.sort((a,b)=>a.date<b.date?-1:1);
    await saveState();
    showToast('Peso registrado!');
    render();
  });

  document.getElementById('saveGoalsBtn').addEventListener('click', async ()=>{
    const k = parseInt(document.getElementById('goalKcal').value,10);
    const p = parseInt(document.getElementById('goalProtein').value,10);
    const c = parseInt(document.getElementById('goalCarbs').value,10);
    if(!isNaN(k) && k>0) state.goals.calorias = k;
    if(!isNaN(p) && p>0) state.goals.proteina = p;
    if(!isNaN(c) && c>0) state.goals.carboidratos = c;
    await saveState();
    showToast('Metas salvas com sucesso!');
  });
}
function wireInitialForm(){
  const btn = document.getElementById('saveInitialBtn');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const peso = parseFloat(document.getElementById('fPeso').value);
    const pesoAlvo = parseFloat(document.getElementById('fPesoAlvo').value);
    const cintura = parseFloat(document.getElementById('fCintura').value);
    const braco = parseFloat(document.getElementById('fBraco').value);
    if([peso,pesoAlvo,cintura,braco].some(v=>isNaN(v) || v<=0)){ showToast('Preencha todos os campos corretamente'); return; }
    state.weight.initial = {peso, pesoAlvo, cintura, braco, date: todayStr()};
    if(state.weight.history.length===0) state.weight.history.push({date:todayStr(), peso});
    await saveState();
    showToast('Metas iniciais salvas!');
    render();
  });
}

/* ============================================================
   INIT / GLOBAL WIRING
   ============================================================ */
document.getElementById('tabNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  addFoodState.selected = null;
  render();
});
document.getElementById('profileSwitch').addEventListener('click', async (e)=>{
  const btn = e.target.closest('.profile-btn');
  if(!btn) return;
  const profile = btn.dataset.profile;
  if(profile===currentProfile) return;
  addFoodState.selected = null; addFoodState.itemsToSave = [];
  await loadProfile(profile);
});

(async function init(){
  await loadProfile('gabriel');
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
})();
</script>
