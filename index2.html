<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>DietaPro — Diário Alimentar</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23644E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DietaPro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-profile="gabriel">

<div id="loginScreen" class="login-screen">
  <div class="login-card" id="loginCard">
    <div class="login-mark"><i data-lucide="leaf"></i></div>
    <h1>DietaPro</h1>
    <p>Acesso exclusivo · Gabriel &amp; Raissa</p>
    <div class="login-field">
      <i data-lucide="lock"></i>
      <input type="password" id="loginPasswordInput" placeholder="Senha de acesso" autocomplete="current-password">
      <button class="login-eye" id="toggleEyeBtn" type="button"><i data-lucide="eye"></i></button>
    </div>
    <button class="login-submit" id="loginSubmitBtn" type="button">Entrar <i data-lucide="arrow-right"></i></button>
    <p class="login-error hidden" id="loginError">Senha incorreta. Tente novamente.</p>
  </div>
</div>

<div id="loadingScreen" class="loading-screen" style="display:none;">
  <div class="loading-mark"><i data-lucide="leaf"></i></div>
  <p>Carregando seu diário...</p>
</div>

<script>
// Checagem instantânea (roda antes de qualquer outro script carregar) para não
// piscar a tela de login quando já existe uma sessão válida salva.
(function(){
  try{
    var until = parseInt(localStorage.getItem('dietapro_auth_until'), 10);
    if(!isNaN(until) && Date.now() < until){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('loadingScreen').style.display = 'flex';
    }
  }catch(e){}
})();
</script>

<div id="app" style="display:none;">
  <header class="app-header">
    <div class="header-top">
      <div class="brand-mini">
        <div class="brand-mark"><i data-lucide="leaf"></i></div>
        <span class="brand-name">DietaPro</span>
      </div>
      <div class="header-actions">
        <button class="sync-status" id="syncNowIconBtn" type="button" title="Sincronizar dados">
          <i data-lucide="refresh-cw"></i>
        </button>
        <div class="profile-slider" id="profileSlider">
          <div class="ps-pill" id="psPill"></div>
          <span class="ps-label active-label" data-target="gabriel">Gabriel</span>
          <span class="ps-label" data-target="raissa">Raissa</span>
        </div>
      </div>
    </div>
  </header>

  <div class="day-nav-row" id="dayNavRow"></div>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="inicio" title="Início"><i data-lucide="home"></i></button>
    <button class="tab-btn" data-tab="historico" title="Histórico"><i data-lucide="history"></i></button>
    <button class="tab-btn fab-btn" data-tab="adicionar" title="Adicionar alimento"><i data-lucide="plus"></i></button>
    <button class="tab-btn" data-tab="cardapio" title="Cardápio"><i data-lucide="book-open"></i></button>
    <button class="tab-btn" data-tab="pesos" title="Perfil"><i data-lucide="user-round"></i></button>
  </nav>

  <main id="content"></main>
</div>

<div id="toast" class="toast"></div>
<div id="modalOverlay" class="modal-overlay hidden"><div id="modalBox" class="modal-box"></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
