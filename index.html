      <button class="modal-opt-btn" data-mark="treino"><i data-lucide="dumbbell"></i>Só Treino</button>
      ${current ? '<button class="modal-opt-btn remove" data-mark="__remove"><i data-lucide="trash-2"></i>Remover marcação</button>' : ''}
    </div>
    <button class="modal-close" id="modalCloseBtn">Cancelar</button>
  `;
  overlay.classList.remove('hidden');
  icons();
  box.querySelectorAll('[data-mark]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const mk = btn.dataset.mark;
      if(mk==='__remove') delete state.calendarMarks[dateStr];
      else state.calendarMarks[dateStr] = mk;
      await saveState();
      overlay.classList.add('hidden');
      render();
    });
  });
  document.getElementById('modalCloseBtn').addEventListener('click', ()=>overlay.classList.add('hidden'));
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.add('hidden'); };
}

      <div id="histContent">${renderHistContent()}</div>
    </section>
  `;
}
function renderHistContent(){
  const today = homeViewDate;
  if(historicoFilter==='ano'){
    const months = {};
    state.meals.forEach(m=>{
      if(m.date < addDays(today,-365)) return;
      const key = m.date.slice(0,7);
      if(!months[key]) months[key] = {kcal:0,count:0};
      months[key].kcal += m.kcal; months[key].count++;
    });
    const keys = Object.keys(months).sort().reverse();
    if(keys.length===0) return '<p class="empty-hint">Nenhum registro no último ano.</p>';
    return keys.map(k=>{
      const label = new Intl.DateTimeFormat('pt-BR',{month:'long', year:'numeric'}).format(new Date(k+'-15T12:00:00Z'));
      return `<div class="hist-day-group"><div class="hist-date-title">${label}</div><div class="hist-day-total">${months[k].count} itens · ${Math.round(months[k].kcal)} kcal totais</div></div>`;
    }).join('');
  }

  let startDate;
  if(historicoFilter==='dia') startDate = today;
  else if(historicoFilter==='semana') startDate = addDays(today,-6);
  else startDate = addDays(today,-29);

  const relevant = state.meals.filter(m=>m.date>=startDate && m.date<=today);
  if(relevant.length===0) return '<p class="empty-hint">Nenhum registro nesse período.</p>';

  const byDate = {};
  relevant.forEach(m=>{ if(!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });
  const dates = Object.keys(byDate).sort().reverse();

  return dates.map(dt=>{
    const items = byDate[dt];
    const total = items.reduce((a,i)=>a+i.kcal,0);
    const groups = Object.keys(MEAL_LABELS).map(mt=>{
      const mi = items.filter(i=>i.mealType===mt);
      if(mi.length===0) return '';
      const mealTotal = mi.reduce((a,i)=>a+i.kcal,0);
      return `<div class="hist-meal-group">
        <div class="hist-meal-title">${MEAL_LABELS[mt]}</div>
        ${mi.map(i=>`<div class="hist-item hist-item-clickable" data-edit-meal="${i.id}"><span class="hi-name">${i.name}</span><span class="hi-sub">${formatQtyLabel(i)} · ${Math.round(i.kcal)}kcal</span><button class="hi-delete" data-delete-meal="${i.id}" data-meal-name="${i.name.replace(/"/g,'&quot;')}"><i data-lucide="trash-2"></i></button></div>`).join('')}
        <div class="hist-meal-total">Total ${MEAL_LABELS[mt].toLowerCase()}: <b>${Math.round(mealTotal)} kcal</b></div>
      </div>`;
    }).join('');
    return `<div class="hist-day-group">
      <div class="hist-date-title">${fmtDateLong(dt)}</div>
      <div class="hist-day-total">${Math.round(total)} kcal no dia</div>
      ${groups}
    </div>`;
  }).join('');
}
function wireHistorico(){
  document.getElementById('histFilter').addEventListener('click', (e)=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    historicoFilter = btn.dataset.filter;
    document.querySelectorAll('#histFilter .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.filter===historicoFilter));
    document.getElementById('histContent').innerHTML = renderHistContent();
  });
}

const FIREBASE_CONFIG = {

function firebaseConfigProvided(){
  return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
}
function loadFirebaseSDK(){
  if(window.firebase && window.firebase.firestore && window.firebase.auth) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
    s1.onload = ()=>{
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
      s2.onload = ()=>{
        const s3 = document.createElement('script');
        s3.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js';
        s3.onload = resolve;
        s3.onerror = reject;
        document.head.appendChild(s3);
      };
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
}
async function autoConnectFirestore(){
  if(!firebaseConfigProvided()){ window.__firestoreReady = false; updateSyncStatusUI(); return; }
  try{
    await loadFirebaseSDK();
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    window.__db = firebase.firestore();
    // Sign in anonymously so Firestore security rules can safely require
    // `request.auth != null` — this happens silently, with no extra login
    // screen for Gabriel/Raissa (their only login is the password gate).
    // We only mark Firestore as "ready" if this succeeds — otherwise every
    // read/write would silently fail with permission-denied while the app
    // still claimed to be connected.
    await firebase.auth().signInAnonymously();
    window.__firestoreReady = true;
  }catch(e){
    console.error('Firestore/Auth não conectou — verifique: 1) "Anonymous" habilitado em Authentication > Sign-in method, 2) o domínio atual em Authentication > Settings > Authorized domains, 3) as regras do Firestore.', e);
    window.__firestoreReady = false;
  }
  updateSyncStatusUI();
  console.log('[NutriRing] Firestore pronto?', window.__firestoreReady);
}
function reportFirestoreError(e){
  console.error('Erro de sincronização com o Firestore', e);
  if(!window.__firestoreErrorShown){
    window.__firestoreErrorShown = true;
    showToast('Não sincronizou com o Firestore — confira as regras de segurança do projeto.');
  }
}
function updateSyncStatusUI(){
  const wrap = document.getElementById('syncStatus');
  const icon = document.getElementById('syncIcon');
  if(!wrap || !icon) return;
  wrap.classList.toggle('on', !!window.__firestoreReady);
  icon.setAttribute('data-lucide', window.__firestoreReady ? 'cloud-check' : 'cloud-off');
  icons();
}

/* ============================================================
   PROFILE SLIDER — drag to switch profile (iOS "slide to power off" style)
   ============================================================ */
function setupProfileSlider(){
  const slider = document.getElementById('profileSlider');
  const pill = document.getElementById('psPill');
  let dragging = false, startX = 0, startLeft = 0;

  function bounds(){
    return {min:3, max:slider.clientWidth - pill.offsetWidth - 3};
  }
  function setPillForProfile(profile, animate){
    const {min,max} = bounds();
    pill.style.transition = animate===false ? 'none' : '';
    pill.style.left = (profile==='gabriel' ? min : max)+'px';
    slider.querySelectorAll('.ps-label').forEach(l=>l.classList.toggle('active-label', l.dataset.target===profile));
    if(animate===false){ void pill.offsetWidth; pill.style.transition=''; }
  }
  setPillForProfile(currentProfile, false);

  function pointerX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
  function onDown(e){
    dragging = true;
    pill.classList.add('dragging');
    startX = pointerX(e);
    startLeft = parseFloat(pill.style.left) || bounds().min;
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    const delta = pointerX(e) - startX;
    const {min,max} = bounds();
    pill.style.left = clamp(startLeft+delta, min, max)+'px';
    e.preventDefault();
  }
  async function onUp(){
    if(!dragging) return;
    dragging = false;
    pill.classList.remove('dragging');
    const {min,max} = bounds();
    const left = parseFloat(pill.style.left);
    const target = left > (min+max)/2 ? 'raissa' : 'gabriel';
    setPillForProfile(target, true);
    if(target !== currentProfile) await loadProfile(target);
  }
  // dragging works from anywhere on the track, not just the small pill —
  // this is the ONLY way to switch profile now (no tap-to-switch on the labels).
  slider.addEventListener('mousedown', onDown);
  slider.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  window.__profileSliderSet = setPillForProfile;
}

/* ============================================================
   DOUBLE-TAP ZOOM PREVENTION (mobile)
   ============================================================ */
/* Double-tap-to-zoom is already fully prevented by `touch-action:manipulation`
   (set globally in the CSS) plus the `user-scalable=no` viewport meta tag.
   We intentionally do NOT add a JS touchend guard here — that approach ends up
   swallowing every other legitimate fast tap (e.g. rapidly tapping +/- buttons),
   making the UI feel laggy. */

/* ============================================================
   LOGIN GATE
   ============================================================ */
// Senha protegida por hash SHA-256 — o texto original não fica exposto no código.
// Para trocar a senha, gere um novo hash SHA-256 (ex: tools.keycdn.com) e cole aqui.
const APP_PASSWORD_HASH = "fe47d3f52122243998056618c7146e35ece42d79d1e3a0bbbdc66d5ca2b17cb3";

// Sessão de login: depois de entrar com a senha uma vez, fica logado por 24h
// (guardado no localStorage do navegador). Passado esse prazo, pede a senha de novo.
const AUTH_SESSION_KEY = 'dietapro_auth_until';
const AUTH_SESSION_MS = 24 * 60 * 60 * 1000; // 24 horas

function hasValidSession(){
  try{
    const until = parseInt(localStorage.getItem(AUTH_SESSION_KEY), 10);
    return !isNaN(until) && Date.now() < until;
  }catch(e){ return false; }
}
function startSession(){
  try{ localStorage.setItem(AUTH_SESSION_KEY, String(Date.now() + AUTH_SESSION_MS)); }catch(e){}
}

async function sha256Hex(text){
  const encoded = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', encoded);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function wireLogin(){
  const input = document.getElementById('loginPasswordInput');
  const submitBtn = document.getElementById('loginSubmitBtn');
  const errorEl = document.getElementById('loginError');
  const card = document.getElementById('loginCard');
  const eyeBtn = document.getElementById('toggleEyeBtn');

  async function tryLogin(){
    const hash = await sha256Hex(input.value);
    if(hash === APP_PASSWORD_HASH){
      startSession();
      document.getElementById('loginScreen').style.display = 'none';
      startApp();
    } else {
      errorEl.classList.remove('hidden');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  }
  submitBtn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });
  eyeBtn.addEventListener('click', ()=>{
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    eyeBtn.innerHTML = `<i data-lucide="${isPwd?'eye-off':'eye'}"></i>`;
    icons();
  });
}
