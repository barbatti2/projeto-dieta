<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>NutriRing — Diário Alimentar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2314B8A6'/%3E%3Ctext x='12' y='17' font-size='14' text-anchor='middle' fill='white'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  @property --pct-deg{
    syntax: '<angle>';
    inherits: true;
    initial-value: 0deg;
  }
  :root{
    --bg:#F6F7FC;
    --surface:#FFFFFF;
    --surface-2:#F2F4FA;
    --surface-3:#E8EBF5;
    --border:#E4E7F2;
    --text:#1C2033;
    --text-muted:#6B7291;
    --text-dim:#9BA1BC;
    --accent-1:#14B8A6;
    --accent-2:#3B82F6;
    --success:#22C55E;
    --warning:#F59E0B;
    --danger:#EF4444;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'Space Grotesk',sans-serif;
    --shadow-card: 0 10px 28px -16px rgba(30,40,90,.18);
  }
  [data-profile="raissa"]{
    --accent-1:#FB7185;
    --accent-2:#F9A8D4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0;padding:0; touch-action:manipulation;}
  body{
    background:
      radial-gradient(circle at 12% -5%, color-mix(in srgb, var(--accent-1) 10%, transparent), transparent 40%),
      radial-gradient(circle at 92% 5%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 38%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background .6s ease;
  }
  #app{max-width:640px;margin:0 auto;padding:0 0 90px 0;min-height:100vh;position:relative;}
  svg.lucide{width:1em;height:1em;stroke-width:2.1;}

  /* ---------- TOP BAR ---------- */
  .app-header{
    padding:16px 14px 14px 14px;
    position:sticky; top:0; z-index:20;
    background:rgba(246,247,252,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:nowrap;}
  .header-left{display:flex; align-items:center; gap:10px; flex-wrap:nowrap; min-width:0;}
  .brand-mini{display:flex; align-items:center; gap:8px; flex:none;}
  .brand-mark{
    width:34px; height:34px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#fff;
    box-shadow:0 5px 13px -5px var(--accent-2);
    transition:background .6s ease;
  }
  .brand-mark svg{width:17px;height:17px;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:-.01em; white-space:nowrap;}

  .header-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .sync-status{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; flex:none;
  }
  .sync-status svg{width:14px;height:14px;}
  .sync-status.on{color:var(--success); border-color:color-mix(in srgb, var(--success) 40%, var(--border));}

  /* ---------- PROFILE SLIDER (drag only, like "slide to power off") ---------- */
  .profile-slider{
    position:relative; display:flex; align-items:center; width:148px; height:38px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border); padding:3px; user-select:none; flex:none;
  }
  .ps-label{
    position:relative; z-index:2; flex:1; text-align:center; font-family:var(--font-display); font-weight:700;
    font-size:11.5px; color:var(--text-muted); transition:color .25s ease; pointer-events:none;
  }
  .ps-label.active-label{color:#fff;}
  .ps-pill{
    position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:calc(100% - 6px); border-radius:999px;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); box-shadow:0 6px 14px -6px var(--accent-2);
    transition:left .3s cubic-bezier(.4,0,.2,1), background .4s ease; cursor:grab; z-index:1; touch-action:none;
  }
  .ps-pill.dragging{transition:none; cursor:grabbing;}

  /* ---------- DAY STRIP (minimalist date switcher, sits above the tab icons, shown on every tab) ---------- */
  .day-nav-row{display:flex; align-items:center; justify-content:center; padding:4px 14px 2px 14px;}
  .day-nav-row.hidden{display:none;}
  .date-strip{position:relative; display:flex; align-items:center; gap:6px; width:100%; max-width:280px;}
  .ds-arrow{
    width:24px; height:24px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .ds-arrow svg{width:13px;height:13px;}
  .ds-arrow:disabled{opacity:.3; cursor:not-allowed;}
  .ds-arrow:not(:disabled):active{background:var(--surface-3);}
  .ds-track{display:flex; flex:1; align-items:center; justify-content:space-between;}
  .ds-cell{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:2px 0; border:none; background:transparent; cursor:pointer; color:var(--text-muted);
  }
  .ds-cell .ds-weekday{font-size:8px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--text-dim);}
  .ds-cell .ds-num{
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--text); transition:background .15s ease, color .15s ease;
  }
  .ds-cell.is-today:not(.selected) .ds-num{color:var(--accent-2); font-weight:800;}
  .ds-cell.selected .ds-num{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff;}
  .ds-cell.disabled{opacity:.3; pointer-events:none;}
  .ds-cell:not(.selected):not(.disabled):active .ds-num{background:var(--surface-2);}

  /* ---------- TAB NAV (icon-only, compact) ---------- */
  .tab-nav{display:flex; justify-content:center; gap:8px; padding:4px 14px 4px 14px; flex-wrap:wrap;}
  .tab-btn{
    flex:none; width:42px; height:42px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s ease;
  }
  .tab-btn svg{width:18px;height:18px;}
  .tab-btn.active{color:#fff; border-color:transparent; background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); box-shadow:0 6px 16px -6px var(--accent-2);}

  main#content{padding:10px 16px 30px 16px; display:flex; flex-direction:column; gap:16px;}

  /* ---------- PAGE HERO (compact header per tab, icon inline with title) ---------- */
  .page-hero{
    text-align:center; padding:16px 20px 14px 20px; border-radius:var(--radius-lg);
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent-1) 10%, white), color-mix(in srgb, var(--accent-2) 10%, white));
    border:1px solid var(--border);
  }
  .hero-title-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px;}
  .hero-icon-inline{
    width:34px; height:34px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; box-shadow:0 6px 14px -6px var(--accent-2);
  }
  .hero-icon-inline svg{width:17px;height:17px;}
  .page-hero h1{font-family:var(--font-display); font-size:19px; margin:0; letter-spacing:-.01em;}
  .page-hero p{margin:0; font-size:13px; color:var(--text-muted);}

  /* ---------- CARDS ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-card);}
  .card h2{font-family:var(--font-display); font-size:15px; margin:0 0 12px 0; text-align:center; letter-spacing:-.01em; display:flex; align-items:center; justify-content:center; gap:7px;}
  .card h2 svg{width:16px;height:16px; color:var(--accent-2);}
  .field-label{display:block; font-size:12px; color:var(--text-muted); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; text-align:center;}

  /* ---------- COLLAPSIBLE CARD (e.g. meals list on Início) ---------- */
  .collapsible-header{
    width:100%; display:flex; align-items:center; gap:8px; background:none; border:none; padding:0; margin:0;
    cursor:pointer; font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--text); text-align:left;
  }
  .collapsible-title{display:flex; align-items:center; gap:7px; flex:1; min-width:0;}
  .collapsible-title svg{width:16px;height:16px; color:var(--accent-2); flex:none;}
  .collapsible-meta{font-size:12px; color:var(--text-muted); font-weight:600; flex:none;}
  .collapsible-chevron{width:16px;height:16px; color:var(--text-dim); flex:none; transition:transform .2s ease;}
  .collapsible-chevron.open{transform:rotate(180deg);}
  .collapsible-body{display:none; margin-top:14px;}
  .collapsible-body.open{display:block;}

  /* ---------- HOME RING ---------- */
  .ring-section{display:flex; flex-direction:column; align-items:center; padding:26px 18px;}
  .ring-outer{position:relative; width:220px; height:220px;}
  .ring-glow{position:absolute; inset:8px; border-radius:50%; background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); filter:blur(30px); opacity:.28;}
  .ring-fill{position:absolute; inset:0; border-radius:50%; background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2) var(--pct-deg, 0deg), var(--surface-3) var(--pct-deg, 0deg) 360deg); transition:--pct-deg 1.2s cubic-bezier(.4,0,.2,1);}
  .ring-outer.over-goal .ring-glow{background:linear-gradient(135deg, var(--danger), #F97316);}
  .ring-outer.over-goal .ring-fill{background: conic-gradient(from 0deg, var(--danger), #F97316 var(--pct-deg, 0deg), var(--surface-3) var(--pct-deg, 0deg) 360deg);}
  .ring-outer.over-goal .kcal-num{color:var(--danger);}
  .ring-alert{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:12px; background:color-mix(in srgb, var(--danger) 12%, transparent); color:var(--danger); font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:12px;}
  .ring-alert svg{width:15px;height:15px; flex:none;}
  .ring-inner{position:absolute; inset:16px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:1px solid var(--border);}
  .ring-inner .kcal-num{font-family:var(--font-mono); font-size:30px; font-weight:700; line-height:1;}
  .ring-inner .kcal-goal{font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); margin-top:4px;}
  .ring-inner .kcal-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:6px;}
  .ring-caption{margin-top:16px; font-size:13px; color:var(--text-muted); text-align:center;}

  .macro-cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .macro-card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 8px 12px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center;}
  .macro-card .macro-name{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .mini-ring-outer{position:relative; width:76px; height:76px;}
  .mini-ring-fill{position:absolute; inset:0; border-radius:50%; background: conic-gradient(from 0deg, var(--ring-c1, var(--accent-1)), var(--ring-c2, var(--accent-2)) var(--pct-deg, 0deg), var(--surface-3) var(--pct-deg, 0deg) 360deg); transition:--pct-deg 1.2s cubic-bezier(.4,0,.2,1);}
  .mini-ring-inner{position:absolute; inset:9px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--border);}
  .mini-ring-inner .mr-val{font-family:var(--font-mono); font-size:14px; font-weight:700; line-height:1;}
  .mini-ring-inner .mr-unit{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .macro-status{font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:99px;}
  .macro-status.ok{color:var(--success); background:color-mix(in srgb, var(--success) 16%, transparent);}
  .macro-status.over{color:var(--danger); background:color-mix(in srgb, var(--danger) 16%, transparent);}

  .meal-summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0;}

  /* ---------- BUTTONS ---------- */
  .btn-primary, .btn-gradient, .btn-outline{
    border:none; cursor:pointer; font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:13px 18px; border-radius:13px; transition:transform .15s ease, opacity .2s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-gradient{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; box-shadow:0 10px 22px -10px var(--accent-2);}
  .btn-outline{background:transparent; color:var(--accent-2); border:1px solid var(--border);}
  .btn-primary:active, .btn-gradient:active, .btn-outline:active{transform:scale(.97);}
  .btn-gradient svg, .btn-outline svg, .btn-primary svg{width:16px;height:16px;}
  .full{width:100%; margin-top:6px;}
  .btn-small{padding:9px 14px; font-size:12.5px; border-radius:11px; margin-top:0;}
  .btn-gradient:disabled, .btn-primary:disabled, .btn-outline:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

  /* ---------- COMPOSER (Adicionar / Cardápio food picker) ---------- */
  .composer-hero{
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent-1) 14%, white), color-mix(in srgb, var(--accent-2) 14%, white));
    border-radius:var(--radius-lg); border:1px solid var(--border); padding:20px;
  }
  .search-wrap{position:relative;}
  .search-input-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-dim);}
  .search-input-icon svg{width:17px;height:17px;}
  #foodSearchInput, #deSearchInput{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:var(--font-body); font-size:14.5px; padding:14px 14px 14px 40px; border-radius:14px; outline:none;
    box-shadow:0 6px 18px -12px rgba(30,40,90,.3);
  }
  #foodSearchInput:focus, #deSearchInput:focus{border-color:var(--accent-2);}
  .dropdown{position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:16px; max-height:300px; overflow-y:auto; z-index:15; box-shadow:var(--shadow-card);}
  .dropdown.hidden{display:none;}
  .dropdown-item{padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover, .dropdown-item:active{background:var(--surface-2);}
  .di-icon{width:30px; height:30px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent-2); flex:none;}
  .di-icon svg{width:15px;height:15px;}
  .di-text{min-width:0; flex:1;}
  .di-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .di-cat{font-size:10.5px; color:var(--text-dim);}
  .dropdown-empty{padding:16px; font-size:13px; color:var(--text-muted); text-align:center;}

  .food-ticket{
    margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px;
    border-left:5px solid var(--accent-1); display:none;
  }
  .food-ticket.show{display:block;}
  .ft-top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .ft-icon{width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center; flex:none;}
  .ft-icon svg{width:20px;height:20px;}
  .ft-name{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .ft-cat{font-size:11px; color:var(--text-muted);}
  .ft-cat.loading{color:var(--accent-2);}
  .ft-macros{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .ft-macro{background:var(--surface-2); border-radius:10px; padding:8px 4px; text-align:center;}
  .ft-macro .fm-val{font-family:var(--font-mono); font-weight:700; font-size:13px;}
  .ft-macro .fm-label{font-size:9.5px; color:var(--text-muted); text-transform:uppercase;}

  /* ---------- QUANTITY ---------- */
  .qty-control{display:flex; align-items:center; justify-content:center; gap:20px; margin:14px 0;}
  .qty-btn{width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .qty-btn svg{width:18px;height:18px;}
  .qty-btn:active{transform:scale(.93);}
  .qty-display{font-family:var(--font-mono); font-size:24px; font-weight:700; min-width:110px; text-align:center;}
  .qty-sub{display:block; font-size:11px; color:var(--text-dim); font-weight:400; margin-top:2px;}
  .quick-qty{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .quick-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-family:var(--font-mono); font-weight:700; font-size:12.5px; padding:10px 4px; border-radius:11px; cursor:pointer;}
  .quick-btn.active{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; border-color:transparent;}

  /* ---------- MEAL TYPE ---------- */
  .meal-type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .meal-type-btn{
    background:var(--surface-2); border:2px solid transparent; color:var(--text-muted); font-family:var(--font-body);
    font-weight:600; font-size:13px; padding:14px 8px; border-radius:14px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .meal-type-btn svg{width:19px;height:19px;}
  .meal-type-btn.active{background:color-mix(in srgb, var(--accent-1) 12%, white); border-color:var(--accent-1); color:var(--text);}
  .meal-type-btn.active svg{color:var(--accent-2);}

  /* ---------- ITEMS QUEUE ---------- */
  .items-list{display:flex; flex-direction:column; gap:8px; margin-bottom:4px;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:14px 0;}
  .item-row{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:11px 13px;}
  .item-row .ir-dot{width:8px; height:8px; border-radius:50%; background:var(--accent-2); flex:none;}
  .item-row .ir-info{min-width:0; flex:1; display:flex; align-items:center; gap:10px;}
  .item-row .ir-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-row .ir-sub{font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}
  .item-row .ir-remove{background:none; border:none; color:var(--danger); cursor:pointer; flex:none; display:flex;}
  .item-row .ir-remove svg{width:16px;height:16px;}
  .queue-total{display:flex; justify-content:space-between; align-items:center; padding:6px 4px 14px 4px; font-size:12.5px; color:var(--text-muted);}
  .queue-total b{font-family:var(--font-mono); color:var(--text); font-size:14px;}

  /* ---------- CALENDAR ---------- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-nav-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .cal-nav-btn svg{width:16px;height:16px;}
  .cal-month-label{font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:capitalize;}
  .cal-clock{display:flex; align-items:center; justify-content:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); text-align:center; margin-bottom:12px;}
  .cal-clock svg{width:13px;height:13px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-dim); font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:11px; font-size:13px; background:var(--surface-2); border:1px solid transparent; cursor:pointer; position:relative; font-family:var(--font-mono);}
  .cal-day.empty{background:transparent; cursor:default;}
  .cal-day.today{border-color:var(--accent-2); animation:pulseToday 1.6s ease-in-out infinite;}
  @keyframes pulseToday{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-2) 45%, transparent);} 50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--accent-2) 0%, transparent);}}
  .mark-dieta_treino{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; font-weight:700;}
  .mark-dieta{background:linear-gradient(135deg, color-mix(in srgb, var(--accent-1) 75%, white), color-mix(in srgb, var(--accent-1) 40%, white)); color:var(--text); font-weight:700;}
  .mark-treino{background:linear-gradient(135deg, color-mix(in srgb, var(--accent-2) 75%, white), color-mix(in srgb, var(--accent-2) 40%, white)); color:var(--text); font-weight:700;}
  .cal-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:16px;}
  .legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted);}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .cal-counters{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .counter-card{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;}
  .counter-card .cc-num{font-family:var(--font-mono); font-size:22px; font-weight:700;}
  .counter-card .cc-label{font-size:10px; color:var(--text-muted); margin-top:3px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,25,45,.45); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal-overlay.hidden{display:none;}
  .modal-box{background:var(--surface); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%; max-width:640px; padding:22px 20px 28px 20px; animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-box h3{font-family:var(--font-display); font-size:17px; margin:0 0 16px 0; text-align:center;}
  .modal-options{display:flex; flex-direction:column; gap:10px;}
  .modal-opt-btn{text-align:left; padding:14px 16px; border-radius:13px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:10px;}
  .modal-opt-btn svg{width:18px;height:18px;}
  .modal-opt-btn.remove{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 30%, var(--border));}
  .modal-close{margin-top:14px; width:100%; text-align:center; background:transparent; border:none; color:var(--text-muted); font-size:13px; padding:8px; cursor:pointer;}
  .modal-field{margin-bottom:12px;}
  .modal-field label{display:block; font-size:12px; color:var(--text-muted); font-weight:700; margin-bottom:6px;}
  .modal-field textarea{width:100%; min-height:110px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; font-family:var(--font-mono); font-size:12px; color:var(--text); resize:vertical;}
  .status-line{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); margin-bottom:14px; justify-content:center;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim);}
  .status-dot.on{background:var(--success);}

  /* ---------- HISTORICO ---------- */
  .filter-segment{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:16px;}
  .seg-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-weight:700; font-size:12.5px; padding:10px 4px; border-radius:11px; cursor:pointer;}
  .seg-btn.active{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; border-color:transparent;}
  .hist-day-group{margin-bottom:16px;}
  .hist-date-title{font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:8px; color:var(--text); text-align:center;}
  .hist-meal-group{margin-bottom:10px;}
  .hist-meal-title{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; margin-bottom:6px; text-align:center;}
  .hist-meal-total{font-size:11.5px; color:var(--text-muted); text-align:right; padding:2px 4px 0 4px;}
  .hist-meal-total b{font-family:var(--font-mono); color:var(--text); font-weight:700;}
  .hist-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:8px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:5px;}
  .hist-item-clickable{cursor:pointer; transition:background .12s ease;}
  .hist-item-clickable:active{background:color-mix(in srgb, var(--accent-2) 10%, var(--surface-2));}
  .hist-item .hi-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hist-item .hi-sub{flex:none; font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted);}
  .hi-delete{flex:none; background:none; border:none; color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:4px; border-radius:8px; transition:color .15s ease, background .15s ease;}
  .hi-delete:active{background:color-mix(in srgb, var(--danger) 12%, transparent);}
  .hi-delete svg{width:15px;height:15px;}
  .hi-delete:hover{color:var(--danger);}
  .hist-day-total{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); margin-top:2px; text-align:center;}

  /* ---------- PESOS ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field label{font-size:11.5px; color:var(--text-muted); font-weight:700; text-align:center;}
  .form-field input{background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:var(--font-mono); font-size:15px; padding:11px 12px; border-radius:11px; outline:none; width:100%; text-align:center;}
  .form-field input:focus{border-color:var(--accent-2);}
  .goal-summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .goal-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:12px; text-align:center;}
  .goal-chip .gc-val{font-family:var(--font-mono); font-size:17px; font-weight:700;}
  .goal-chip .gc-label{font-size:10.5px; color:var(--text-muted); margin-top:3px;}
  .progress-capsule{height:24px; border-radius:99px; background:var(--surface-3); overflow:hidden; border:1px solid var(--border); position:relative;}
  .progress-capsule-fill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition:width 1.2s cubic-bezier(.4,0,.2,1); display:flex; align-items:center; justify-content:flex-end;}
  .progress-capsule-fill span{font-family:var(--font-mono); font-size:10.5px; color:#fff; font-weight:700; padding-right:8px;}
  .weight-history-list{display:flex; flex-direction:column; gap:7px; margin-top:12px; max-height:220px; overflow-y:auto;}
  .wh-row{display:flex; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px;}
  .wh-row .wh-val{font-family:var(--font-mono); font-weight:700;}
  .wh-row-clickable{cursor:pointer; transition:background .12s ease;}
  .wh-row-clickable:active{background:color-mix(in srgb, var(--danger) 10%, var(--surface-2));}
  .inline-row{display:flex; gap:10px; align-items:flex-end;}
  .inline-row .form-field{flex:1;}

  /* ---------- CARDÁPIO ÚNICO (por categoria, com alternativas) ---------- */
  .menu-meal-card{position:relative;}
  .menu-meal-header{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:4px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px dashed var(--border);
  }
  .menu-meal-icon{
    width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; margin-bottom:6px;
    box-shadow:0 8px 18px -8px var(--accent-2);
  }
  .menu-meal-icon svg{width:20px;height:20px;}
  .menu-meal-title{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.01em;}
  .menu-meal-sub{font-size:11.5px; color:var(--text-muted); font-family:var(--font-mono);}

  .menu-food-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .menu-food-row{
    display:flex; align-items:center; gap:11px; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:14px; padding:10px 12px; cursor:pointer; transition:all .15s ease;
  }
  .menu-food-row .mf-check{
    width:20px; height:20px; border-radius:7px; border:2px solid var(--text-dim); flex:none;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .menu-food-row .mf-check svg{width:12px;height:12px; color:#fff; opacity:0; transition:opacity .15s ease;}
  .menu-food-row .mf-info{display:flex; flex-direction:column; min-width:0; flex:1;}
  .menu-food-row .mf-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-food-row .mf-sub{font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}
  .menu-food-row.checked{background:color-mix(in srgb, var(--accent-1) 14%, white); border-color:var(--accent-1);}
  .menu-food-row.checked .mf-check{background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-color:transparent;}
  .menu-food-row.checked .mf-check svg{opacity:1;}
  .menu-food-row .mf-remove{background:none; border:none; color:var(--text-dim); cursor:pointer; display:flex; padding:2px; flex:none;}
  .menu-food-row .mf-remove svg{width:15px;height:15px;}
  .menu-food-row-view{
    display:flex; align-items:center; gap:11px; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:14px; padding:10px 12px;
  }
  .menu-food-row-view .mfv-dot{width:8px; height:8px; border-radius:50%; flex:none; background:linear-gradient(135deg, var(--accent-1), var(--accent-2));}
  .menu-food-row-view .mf-info{display:flex; flex-direction:column; min-width:0; flex:1;}
  .menu-food-row-view .mf-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-food-row-view .mf-sub{font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}
  .menu-add-food-btn{
    width:100%; margin-top:4px; background:var(--surface-2); border:1.5px dashed var(--border); color:var(--text-muted);
    font-weight:700; font-size:13px; padding:12px; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .menu-add-food-btn svg{width:15px;height:15px;}
  .menu-meal-footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);
  }
  .menu-meal-footer .mf-total{font-size:12px; color:var(--text-muted);}
  .menu-meal-footer .mf-total b{font-family:var(--font-mono); color:var(--text); font-size:14px;}
  .menu-save-btn{
    flex:none; display:flex; align-items:center; gap:6px; background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#fff; border:none; font-weight:700; font-size:12.5px; padding:10px 16px; border-radius:12px; cursor:pointer;
    box-shadow:0 8px 18px -10px var(--accent-2);
  }
  .menu-save-btn:active{transform:scale(.97);}
  .menu-save-btn:disabled{opacity:.45; cursor:not-allowed;}
  .menu-save-btn svg{width:14px;height:14px;}
  .menu-empty-slots{text-align:center; color:var(--text-dim); font-size:12.5px; padding:6px 0 12px 0;}

  /* taller bottom sheet, for the menu option picker */
  .modal-box-tall{max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .sheet-drag-handle{width:36px; height:4px; border-radius:99px; background:var(--surface-3); margin:0 auto 14px auto;}
  .sheet-subtitle{text-align:center; font-size:12px; color:var(--text-muted); margin-top:-10px; margin-bottom:16px;}
  .name-input{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-size:14.5px; padding:12px 14px; border-radius:12px; outline:none; text-align:left;}
  .name-input:focus{border-color:var(--accent-2);}

  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); background:var(--text); color:#fff; padding:12px 18px; border-radius:13px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .3s ease; z-index:200; box-shadow:var(--shadow-card); max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  .loading-screen{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:300;}
  .loading-ring{width:50px; height:50px; border-radius:50%; border:4px solid var(--surface-3); border-top-color:var(--accent-2); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen p{color:var(--text-muted); font-size:13px;}

  /* mini spinner used inline in the macro chips while the AI is calculating */
  .mini-spinner{
    display:inline-block; width:12px; height:12px; border-radius:50%;
    border:2px solid var(--surface-3); border-top-color:var(--accent-2);
    animation:spin .8s linear infinite; vertical-align:middle;
  }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen{
    position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent-1) 16%, transparent), transparent 45%),
      radial-gradient(circle at 88% 0%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 42%),
      radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--accent-1) 10%, transparent), transparent 45%),
      var(--bg);
  }
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:28px; padding:38px 30px 32px 30px; text-align:center;
    box-shadow:0 30px 60px -28px rgba(30,40,90,.28);
  }
  .login-icon{
    width:64px; height:64px; margin:0 auto 18px auto; border-radius:20px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; box-shadow:0 12px 26px -8px var(--accent-2);
  }
  .login-icon svg{width:30px;height:30px;}
  .login-card h1{font-family:var(--font-display); font-size:24px; color:var(--text); margin:0 0 6px 0; letter-spacing:-.01em;}
  .login-card > p{color:var(--text-muted); font-size:13px; margin:0 0 26px 0;}
  .login-field{
    position:relative; display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:14px; padding:4px 6px 4px 16px; margin-bottom:16px; transition:border-color .2s ease, box-shadow .2s ease;
  }
  .login-field:focus-within{
    border-color:color-mix(in srgb, var(--accent-2) 55%, var(--border));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent-2) 14%, transparent);
  }
  .login-field svg{width:17px;height:17px; color:var(--text-dim); flex:none;}
  .login-field input{
    flex:1; background:transparent; border:none; outline:none !important; box-shadow:none !important; color:var(--text); font-family:var(--font-body);
    font-size:15px; padding:12px 10px; min-width:0;
  }
  .login-field input::placeholder{color:var(--text-dim);}
  .login-eye{background:none; border:none; color:var(--text-dim); cursor:pointer; display:flex; padding:8px;}
  .login-eye svg{width:17px;height:17px;}
  .login-submit{
    width:100%; border:none; cursor:pointer; font-family:var(--font-body); font-weight:700; font-size:15px;
    padding:15px 18px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; box-shadow:0 14px 26px -10px var(--accent-2);
    transition:transform .15s ease;
  }
  .login-submit:active{transform:scale(.97);}
  .login-submit svg{width:16px;height:16px;}
  .login-error{color:var(--danger); font-size:12.5px; margin:14px 0 0 0; min-height:16px;}
  .login-error.hidden{visibility:hidden;}
  .login-foot{color:var(--text-dim); font-size:11.5px; margin-top:22px;}
  @keyframes shakeCard{
    10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-5px);} 40%,60%{transform:translateX(5px);}
  }
  .login-card.shake{animation:shakeCard .5s cubic-bezier(.36,.07,.19,.97);}

  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}

  @media (max-width:380px){
    .ring-outer{width:190px; height:190px;}
    .macro-card .macro-val{font-size:16px;}
  }
</style>
</head>
<body data-profile="gabriel">

<div id="loginScreen" class="login-screen">
  <div class="login-card" id="loginCard">
    <div class="login-icon"><i data-lucide="flame"></i></div>
    <h1>DietaPro</h1>
    <p>Acesso exclusivo • Gabriel &amp; Raissa</p>

  </div>
</div>

<div id="loadingScreen" class="loading-screen" style="display:none;"><div class="loading-ring"></div><p>Carregando seu diário...</p></div>

<div id="app" style="display:none;">
  <header class="app-header">
    <div class="header-top">
      <div class="brand-mini">
        <div class="brand-mark"><i data-lucide="flame"></i></div>
        <span class="brand-name">DietaPro</span>
      </div>
      <div class="profile-slider" id="profileSlider">
        <div class="ps-pill" id="psPill"></div>
        <span class="ps-label active-label" data-target="gabriel">Gabriel</span>
        <span class="ps-label" data-target="raissa">Raissa</span>

    </div>
  </header>

  <div class="day-nav-row" id="dayNavRow"></div>

  <nav class="tab-nav" id="tabNav">

    <button class="tab-btn" data-tab="adicionar" title="Adicionar alimento"><i data-lucide="plus"></i></button>

<script>
/* ============================================================
   NUTRIRING — APP LOGIC
   ============================================================ */

/* ---------- helpers ---------- */
function normalize(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){
  return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
}
function nowBRTime(){
  return new Intl.DateTimeFormat('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit', second:'2-digit'}).format(new Date());
}
function addDays(dateStr, delta){
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0,10);
}
function fmtDateLong(dateStr){
  const d = new Date(dateStr + 'T12:00:00Z');
  return new Intl.DateTimeFormat('pt-BR', {timeZone:'UTC', day:'2-digit', month:'long', year:'numeric'}).format(d);
}
function fmtDateShort(dateStr){
  const d = new Date(dateStr + 'T12:00:00Z');
  return new Intl.DateTimeFormat('pt-BR', {timeZone:'UTC', day:'2-digit', month:'2-digit'}).format(d);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;

/* ============================================================
   CÁLCULO NUTRICIONAL VIA IA (Google Gemini) — usado
   exclusivamente para recalcular kcal/proteína/carbo/gordura por
   100g sempre que um alimento é selecionado, tanto em "Adicionar"
   quanto em "Cardápio". Nenhum outro uso de IA existe no app.

   ATENÇÃO: colocar a chave da API direto neste arquivo faz com que
   ela fique visível para qualquer pessoa que veja o código-fonte da
   página (Ctrl+U ou DevTools). Isso é aceitável só para uso pessoal
   e de baixo risco; para um app com mais gente acessando, o ideal é
   um pequeno servidor/proxy guardando a chave.

   Como configurar (chave do Google AI Studio / Gemini):
   1) Gere uma chave gratuita em https://aistudio.google.com/apikey
   2) Cole a chave abaixo em GEMINI_API_KEY (hoje o AI Studio emite
      chaves no formato "AQ.Ab..."; chaves antigas no formato
      "AIzaSy..." também funcionam, mas o Google está descontinuando
      esse formato)
   Sem a chave preenchida, o app cai automaticamente para a
   estimativa local (sem quebrar o app).
   ============================================================ */
const GEMINI_API_KEY = "AQ.Ab8RN6JUihBHqGJZhylj3nEZrAuubISar5VNBk0MRJCrgsGtEQ";
const GEMINI_MODEL = "gemini-2.5-flash-lite";

function aiConfigProvided(){
  return !!(GEMINI_API_KEY && GEMINI_API_KEY.trim().length > 0 && GEMINI_API_KEY.trim() !== "COLE_AQUI_SUA_CHAVE_DO_GEMINI");
}

const aiNutritionCache = {}; // cache em memória desta sessão: normalize(nome) -> {kcal,protein,carbs,fat}

async function getAINutrition(foodName){
  const key = normalize(foodName);
  if(aiNutritionCache[key]) return aiNutritionCache[key];

  // cache compartilhado (mesmo alimento = mesmo valor para qualquer perfil/sessão),
  // evita chamar a IA de novo para algo que já foi calculado antes.
  if(hasLocalStorage()){
    try{
      const cached = await window.storage.get('ai_nutri_v2_'+key, true);
      if(cached && cached.value){
        const parsed = JSON.parse(cached.value);
        if(isFinite(parsed.kcal)){
          aiNutritionCache[key] = parsed;
          return parsed;
        }
      }
    }catch(e){ /* não existe no cache ainda, segue pro cálculo */ }
  }

  if(!aiConfigProvided()){
    console.warn('[NutriRing] GEMINI_API_KEY não configurada — usando estimativa local para "'+foodName+'"');
    return null;
  }

  try{
    const prompt = "Você é uma base de dados nutricional precisa, baseada em tabelas de referência confiáveis (como TACO - Tabela Brasileira de Composição de Alimentos, e USDA FoodData Central). Para o alimento brasileiro a seguir, calcule os valores médios por 100 gramas do alimento PRONTO/preparado (ou seja, já considerando perdas de água e concentração de nutrientes do cozimento, se for o caso). Regras importantes: se o modo de preparo não especificar adição de óleo, manteiga, molhos ou açúcar, assuma a versão mais simples e magra (ex: grelhado/cozido sem gordura extra, carnes sem pele e sem gordura visível, exceto se o nome disser o contrário). Se o modo de preparo estiver indicado entre parênteses, respeite-o. Responda SOMENTE com um objeto JSON válido, sem nenhum texto adicional, sem markdown, sem explicação — apenas o JSON: {\"kcal\":number,\"protein\":number,\"carbs\":number,\"fat\":number} (protein, carbs e fat em gramas, por 100g do alimento pronto). Alimento: \"" + foodName + "\"";

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          contents: [
            { role: "user", parts: [ { text: prompt } ] }
          ],
          generationConfig: {
            temperature: 0,
            responseMimeType: "application/json",
            maxOutputTokens: 200,
            thinkingConfig: { thinkingBudget: 0 }
          }
        })
      }
    );
    if(!response.ok){
      const errBody = await response.text().catch(()=> '');
      throw new Error('Gemini respondeu com status '+response.status+' '+errBody);
    }
    const data = await response.json();
    const textBlock = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
    const cleaned = textBlock.replace(/```json|```/g,'').trim();
    const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
    const parsedRaw = JSON.parse(jsonMatch ? jsonMatch[0] : cleaned);
    const result = {
      kcal: Number(parsedRaw.kcal),
      protein: Number(parsedRaw.protein),
      carbs: Number(parsedRaw.carbs),
      fat: Number(parsedRaw.fat)
    };
    if(!isFinite(result.kcal) || !isFinite(result.protein) || !isFinite(result.carbs) || !isFinite(result.fat)){
      throw new Error('Resposta do Gemini não trouxe números válidos');
    }
    aiNutritionCache[key] = result;
    if(hasLocalStorage()){
      window.storage.set('ai_nutri_v2_'+key, JSON.stringify(result), true).catch(()=>{});
    }
    return result;
  }catch(e){
    console.error('Erro ao calcular nutrição com Gemini para "'+foodName+'"', e);
    return null;
  }
}

function ensureStateShape(s){
  if(!s) return;
  if(!s.cardapioUnico){
    // migra estrutura antiga (por dia da semana), se existir, para o cardápio único (lista simples)
    if(s.cardapioSemanal){
      const merged = defaultCardapioUnico();
      Object.keys(s.cardapioSemanal).forEach(dayKey=>{
        const dayMeals = s.cardapioSemanal[dayKey];
        Object.keys(MEAL_LABELS).forEach(mt=>{
          (dayMeals[mt]||[]).forEach(item=>{
            merged[mt].push({
              uid: item.uid || (Date.now()+'_'+Math.random().toString(36).slice(2,7)),
              name:item.name, category:item.category, grams:item.grams, qty:item.qty, isUnit:item.isUnit,
              kcal:item.kcal, protein:item.protein, carbs:item.carbs, fat:item.fat, checked:false
            });
          });
        });
      });
      s.cardapioUnico = merged;
      delete s.cardapioSemanal;
    } else {
      s.cardapioUnico = defaultCardapioUnico();
    }
  } else {
    // migra formato antigo (categorias/slots com alternativas) para lista simples de alimentos
    Object.keys(MEAL_LABELS).forEach(mt=>{
      if(!s.cardapioUnico[mt]) { s.cardapioUnico[mt] = emptyMenuMeal(); return; }
      const arr = s.cardapioUnico[mt];
      const hasSlots = arr.some(entry=>entry && Array.isArray(entry.options));
      if(hasSlots){
        const flat = [];
        arr.forEach(slot=>{
          (slot.options||[]).forEach(opt=>{
            flat.push({
              uid: opt.uid || (Date.now()+'_'+Math.random().toString(36).slice(2,7)),
              name:opt.name, category:opt.category, grams:opt.grams, qty:opt.qty, isUnit:opt.isUnit,
              kcal:opt.kcal, protein:opt.protein, carbs:opt.carbs, fat:opt.fat, checked:false
            });
          });
        });
        s.cardapioUnico[mt] = flat;
      } else {
        arr.forEach(item=>{ if(typeof item.checked!=='boolean') item.checked=false; });
      }
    });
  }
  if(!s.meals) s.meals = [];
  if(!s.calendarMarks) s.calendarMarks = {};
  if(!s.weight) s.weight = {initial:null, history:[]};
  if(!s.goals) s.goals = {calorias:2000, proteina:150, carboidratos:250};
  if(!s.cardapioSalvo){
    // primeira vez com esse campo: considera "já salvo" qualquer refeição que já tinha
    // algum alimento marcado em versões anteriores, pra não perder o que a pessoa já tinha escolhido
    s.cardapioSalvo = defaultCardapioSalvo();
    Object.keys(MEAL_LABELS).forEach(mt=>{
      if((s.cardapioUnico[mt]||[]).some(it=>it.checked)) s.cardapioSalvo[mt] = true;
    });
  } else {
    Object.keys(MEAL_LABELS).forEach(mt=>{ if(typeof s.cardapioSalvo[mt]!=='boolean') s.cardapioSalvo[mt]=false; });
  }
}

function hasLocalStorage(){
  return typeof window.storage !== 'undefined' && window.storage !== null;
}
async function loadProfile(profile){
  currentProfile = profile;
  document.body.setAttribute('data-profile', profile);
  if(profileCache[profile]){
    state = profileCache[profile];
    render();
    return;
  }
  // Firestore is the source of truth when connected; window.storage (only available
  // inside Claude's own artifact runtime) is just an extra offline cache when present.
  if(window.__firestoreReady){
    try{
      console.log('[NutriRing] Buscando perfil no Firestore:', profile);
      const doc = await window.__db.collection('nutriring').doc(profile).get();
      console.log('[NutriRing] Documento existe?', doc.exists, doc.exists ? doc.data() : null);
      if(doc.exists){
        state = doc.data();
        profileCache[profile] = state;
        if(hasLocalStorage()){
          window.storage.set('nutriring_'+profile, JSON.stringify(state), false).catch(()=>{});
        }
        render();
        return;
      }
    }catch(e){ reportFirestoreError(e); }
  }
  if(hasLocalStorage()){
    try{
      const res = await window.storage.get('nutriring_'+profile, false);
      state = res && res.value ? JSON.parse(res.value) : defaultState();
    }catch(e){
      state = defaultState();
    }
  } else {
    state = defaultState();
  }
  profileCache[profile] = state;
  render();
}
async function saveState(){
  // keep the in-memory cache authoritative immediately so switching tabs/profiles
  // never shows stale data even if a network write is slow or briefly fails.
  profileCache[currentProfile] = state;
  if(hasLocalStorage()){
    try{
      const result = await window.storage.set('nutriring_'+currentProfile, JSON.stringify(state), false);
      if(!result){
        await window.storage.set('nutriring_'+currentProfile, JSON.stringify(state), false);
      }
    }catch(e){
      console.error('Erro ao salvar localmente', e);
    }
  }
  if(window.__firestoreReady){
    try{ await window.__db.collection('nutriring').doc(currentProfile).set(state); }
    catch(e){ reportFirestoreError(e); }
  }
}

function homeDateLabel(dateStr){
  const today = todayStr();
  if(dateStr===today) return 'Hoje';
  if(dateStr===addDays(today,-1)) return 'Ontem';
  return fmtDateShort(dateStr);
}
function weekdayAbbr(dateStr){
  return new Intl.DateTimeFormat('pt-BR', {weekday:'short', timeZone:'UTC'}).format(new Date(dateStr+'T12:00:00Z')).replace('.','').toUpperCase();
}
function computeStripDates(){
  const today = todayStr();
  let dates = [-2,-1,0,1,2].map(off=>addDays(homeViewDate, off));
  // never show dates beyond today — shift the whole window back if needed
  while(dates[dates.length-1] > today){
    dates = dates.map(d=>addDays(d,-1));
  }
  return dates;
}
function updateHeaderDayNav(){
  const row = document.getElementById('dayNavRow');
  if(!row) return;
  const today = todayStr();
  const isAtToday = homeViewDate === today;
  const dates = computeStripDates();

  const cellsHTML = dates.map(d=>{
    const selected = d===homeViewDate;
    const isToday = d===today;
    const future = d > today;
    const num = parseInt(d.slice(8,10),10);
    const cls = ['ds-cell', selected?'selected':'', isToday?'is-today':'', future?'disabled':''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-date="${d}">
      <span class="ds-weekday">${weekdayAbbr(d)}</span>
      <span class="ds-num">${num}</span>
    </button>`;
  }).join('');

  row.innerHTML = `

   #dayNavRow's inner HTML gets rebuilt on every render(). */

function openHomeCalendarModal(){
  const d = new Date(homeViewDate+'T12:00:00Z');
  homeCalendarViewDate = new Date(d.getUTCFullYear(), d.getUTCMonth(), 1);
  renderHomeCalendarModal();
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function renderHomeCalendarModal(){
  const box = document.getElementById('modalBox');
  const year = homeCalendarViewDate.getFullYear();
  const month = homeCalendarViewDate.getMonth();
  const monthLabel = new Intl.DateTimeFormat('pt-BR', {month:'long', year:'numeric'}).format(homeCalendarViewDate);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(dateStr > today){
      cells += `<div class="cal-day empty" style="opacity:.3;">${d}</div>`;
      continue;
    }
    const isToday = dateStr===today;
    const isSelected = dateStr===homeViewDate;
    cells += `<div class="cal-day ${isToday?'today':''} ${isSelected?'mark-dieta_treino':''}" data-pick-date="${dateStr}">${d}</div>`;
  }

  box.innerHTML = `
    <h3>Selecionar dia</h3>
    <div class="cal-header">
      <button class="cal-nav-btn" id="homeCalPrev"><i data-lucide="chevron-left"></i></button>
      <span class="cal-month-label">${monthLabel}</span>
      <button class="cal-nav-btn" id="homeCalNext"><i data-lucide="chevron-right"></i></button>
    </div>
    <div class="cal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="cal-grid" id="homeCalGrid">${cells}</div>
    <button class="modal-close" id="homeCalCloseBtn">Fechar</button>
  `;
  icons();
  document.getElementById('homeCalPrev').addEventListener('click', ()=>{
    homeCalendarViewDate = new Date(year, month-1, 1);
    renderHomeCalendarModal();
  });
  document.getElementById('homeCalNext').addEventListener('click', ()=>{
    homeCalendarViewDate = new Date(year, month+1, 1);
    renderHomeCalendarModal();
  });
  document.getElementById('homeCalGrid').addEventListener('click', (e)=>{
    const cell = e.target.closest('[data-pick-date]');
    if(!cell) return;
    homeViewDate = cell.dataset.pickDate;
    document.getElementById('modalOverlay').classList.add('hidden');
    render();
  });
  document.getElementById('homeCalCloseBtn').addEventListener('click', ()=>document.getElementById('modalOverlay').classList.add('hidden'));
  const overlayEl = document.getElementById('modalOverlay');
  overlayEl.onclick = (e)=>{ if(e.target===overlayEl) overlayEl.classList.add('hidden'); };
}

function macroStatusHTML(consumed, goal){
  if(!goal || goal<=0) return '';
  const diff = Math.round(goal - consumed);
  if(diff < 0) return `<div class="macro-status over">${diff}g</div>`;
  return `<div class="macro-status ok">+${diff}g</div>`;
}
function renderInicio(){
  const today = homeViewDate;
  const isToday = today === todayStr();
  const meals = state.meals.filter(m=>m.date===today);
  const sum = meals.reduce((a,m)=>({kcal:a.kcal+m.kcal, protein:a.protein+m.protein, carbs:a.carbs+m.carbs, fat:a.fat+m.fat}), {kcal:0,protein:0,carbs:0,fat:0});
  const goals = state.goals;
  const pct = clamp(goals.calorias>0 ? (sum.kcal/goals.calorias*100) : 0, 0, 100);
  const pctDeg = (pct*3.6).toFixed(1)+'deg';

  const remProtein = Math.max(0, Math.round(goals.proteina - sum.protein));
  const remCarbs = Math.max(0, Math.round(goals.carboidratos - sum.carbs));
  const goalFat = Math.round(goals.calorias*0.28/9); // meta de gordura derivada (~28% das calorias da meta)
  const remFat = Math.max(0, Math.round(goalFat - sum.fat));
  const pctProtein = clamp(goals.proteina>0 ? sum.protein/goals.proteina*100:0,0,100);
  const pctCarbs = clamp(goals.carboidratos>0 ? sum.carbs/goals.carboidratos*100:0,0,100);
  const pctFat = clamp(goalFat>0 ? sum.fat/goalFat*100:0,0,100);
  const proteinDeg = (pctProtein*3.6).toFixed(1)+'deg';
  const carbsDeg = (pctCarbs*3.6).toFixed(1)+'deg';
  const fatDeg = (pctFat*3.6).toFixed(1)+'deg';

  const isOverGoal = goals.calorias>0 && sum.kcal > goals.calorias;
  const overAmount = Math.round(sum.kcal - goals.calorias);

  return `
    ${heroHTML('inicio')}
    <section class="card ring-section">
      <div class="ring-outer${isOverGoal?' over-goal':''}">
        <div class="ring-glow"></div>
        <div class="ring-fill" data-ring-deg="${pctDeg}" style="--pct-deg:0deg"></div>
        <div class="ring-inner">
          <div class="kcal-num">${Math.round(sum.kcal)}</div>
          <div class="kcal-goal">de ${goals.calorias} kcal</div>
          <div class="kcal-label">${isToday ? 'consumidas hoje' : 'consumidas nesse dia'}</div>
        </div>
      </div>
      <p class="ring-caption">${meals.length} ${meals.length===1?'item registrado':'itens registrados'} ${isToday ? 'hoje' : 'nesse dia'}</p>
      ${isOverGoal ? `<div class="ring-alert"><i data-lucide="alert-triangle"></i>${overAmount} kcal acima da meta ${isToday?'de hoje':'desse dia'}</div>` : ''}
    </section>

    <section class="macro-cards">
      <div class="macro-card">
        <div class="mini-ring-outer">
          <div class="mini-ring-fill" data-ring-deg="${proteinDeg}" style="--pct-deg:0deg; --ring-c1:#FB923C; --ring-c2:#F97316;"></div>
          <div class="mini-ring-inner"><span class="mr-val">${remProtein}g</span><span class="mr-unit">faltam</span></div>
        </div>
        <span class="macro-name">Proteína</span>
        ${macroStatusHTML(sum.protein, goals.proteina)}
      </div>
      <div class="macro-card">
        <div class="mini-ring-outer">
          <div class="mini-ring-fill" data-ring-deg="${carbsDeg}" style="--pct-deg:0deg; --ring-c1:#FBBF24; --ring-c2:#F59E0B;"></div>
          <div class="mini-ring-inner"><span class="mr-val">${remCarbs}g</span><span class="mr-unit">faltam</span></div>
        </div>
        <span class="macro-name">Carboidratos</span>
        ${macroStatusHTML(sum.carbs, goals.carboidratos)}
      </div>
      <div class="macro-card">
        <div class="mini-ring-outer">
          <div class="mini-ring-fill" data-ring-deg="${fatDeg}" style="--pct-deg:0deg; --ring-c1:#A78BFA; --ring-c2:#8B5CF6;"></div>
          <div class="mini-ring-inner"><span class="mr-val">${remFat}g</span><span class="mr-unit">faltam</span></div>
        </div>
        <span class="macro-name">Gordura</span>
        ${macroStatusHTML(sum.fat, goalFat)}
      </div>
    </section>

    <section class="card">
      <button class="collapsible-header" id="mealsToggleBtn" type="button">
        <span class="collapsible-title"><i data-lucide="clipboard-list"></i>${isToday ? 'Refeições de hoje' : 'Refeições do dia'}</span>
        <span class="collapsible-meta">${meals.length} ${meals.length===1?'item':'itens'}</span>
        <i data-lucide="chevron-down" class="collapsible-chevron${homeMealsExpanded?' open':''}"></i>
      </button>
      <div class="collapsible-body${homeMealsExpanded?' open':''}">
        ${meals.length===0 ? '<p class="empty-hint">Nenhum alimento registrado ainda'+(isToday?'. Vá até "Adicionar" para começar.':' nesse dia.')+'</p>' :
          Object.keys(MEAL_LABELS).map(mt=>{
            const items = meals.filter(m=>m.mealType===mt);
            if(items.length===0) return '';
            const tot = items.reduce((a,i)=>a+i.kcal,0);
            return `<div class="hist-meal-group">
              <div class="hist-meal-title">${MEAL_LABELS[mt]} · ${Math.round(tot)} kcal</div>
              ${items.map(i=>`<div class="hist-item" data-meal-id="${i.id}"><span class="hi-name">${i.name}</span><span class="hi-sub">${formatQtyLabel(i)} · ${Math.round(i.kcal)}kcal</span><button class="hi-delete" data-delete-meal="${i.id}" data-meal-name="${i.name.replace(/"/g,'&quot;')}"><i data-lucide="trash-2"></i></button></div>`).join('')}
            </div>`;
          }).join('')
        }
      </div>
    </section>
  `;
}

function updateQtyUI(rebuildPresets){
  const food = addFoodState.selected;
  if(!food) return;
  const qtyDisplay = document.getElementById('qtyDisplay');
  const qtySub = document.getElementById('qtySub');
  const quickQty = document.getElementById('quickQty');
  qtyDisplay.childNodes[0].nodeValue = addFoodState.qty;
  qtySub.textContent = addFoodState.isUnit ? (addFoodState.qty===1?'unidade':'unidades') : (isBeverageFood(food) ? 'ml' : 'gramas');

  if(rebuildPresets){
    const presets = addFoodState.isUnit ? [1,2,3,4] : [50,100,150,200];
    quickQty.innerHTML = presets.map(p=>`<button class="quick-btn" data-qty="${p}">${p}${addFoodState.isUnit?' un':(isBeverageFood(food)?'ml':'g')}</button>`).join('');
  }
  quickQty.querySelectorAll('.quick-btn').forEach(b=>b.classList.toggle('active', parseFloat(b.dataset.qty)===addFoodState.qty));

  if(!addFoodState.aiMacros) return; // ainda calculando com a IA — placeholders seguem na tela

  const gramsEquiv = addFoodState.isUnit ? addFoodState.qty*food.unitWeight : addFoodState.qty;
  const factor = gramsEquiv/100;
  const macros = addFoodState.aiMacros;
  const ftMacros = document.getElementById('ftMacros');
  ftMacros.children[0].firstElementChild.textContent = Math.round(macros.kcal*factor);
  ftMacros.children[1].firstElementChild.textContent = (Math.round(macros.protein*factor*10)/10)+'g';
  ftMacros.children[2].firstElementChild.textContent = (Math.round(macros.carbs*factor*10)/10)+'g';
  ftMacros.children[3].firstElementChild.textContent = (Math.round(macros.fat*factor*10)/10)+'g';
}

  ticket.classList.add('show');

    const f = addFoodState.selected;

    const gramsEquiv = addFoodState.isUnit ? addFoodState.qty*f.unitWeight : addFoodState.qty;
    const factor = gramsEquiv/100;
    addFoodState.itemsToSave.push({
      uid: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      name:f.name, category:f.category, grams:gramsEquiv, qty:addFoodState.qty, isUnit:addFoodState.isUnit, mealType:addFoodState.mealType,
      kcal:macros.kcal*factor, protein:macros.protein*factor, carbs:macros.carbs*factor, fat:macros.fat*factor
    });

    // clear the pre-selection so the next food can be picked right away

    document.getElementById('queueTotalKcal').textContent = Math.round(addFoodState.itemsToSave.reduce((a,i)=>a+i.kcal,0))+' kcal';
    icons();

  document.getElementById('itemsList').addEventListener('click', (e)=>{

    document.getElementById('queueTotalKcal').textContent = Math.round(addFoodState.itemsToSave.reduce((a,i)=>a+i.kcal,0))+' kcal';
    icons();

  document.getElementById('saveMealBtn').addEventListener('click', async ()=>{
    if(addFoodState.itemsToSave.length===0){ showToast('Inclua pelo menos um item'); return; }
    const today = homeViewDate;
    addFoodState.itemsToSave.forEach(it=>{
      state.meals.push({
        id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
        date: today, mealType: it.mealType, name: it.name, category: it.category, grams: it.grams, qty: it.qty, isUnit: it.isUnit,
        kcal: it.kcal, protein: it.protein, carbs: it.carbs, fat: it.fat
      });
    });
    addFoodState.itemsToSave = [];
    await saveState();
    document.getElementById('itemsList').innerHTML = renderItemsListHTML();
    document.getElementById('queueTotalKcal').textContent = '0 kcal';
    showToast('Refeição salva com sucesso!');
  });
}

/* ============================================================
   TAB: CARDÁPIO — lista de alimentos por refeição (café da manhã,
   almoço, café da tarde, jantar), igual ao padrão de "Metas iniciais"
   em Pesos e medidas: você marca os alimentos, toca em Salvar e o
   card passa a exibir o resumo salvo com um botão "Editar" para
   reabrir e mudar depois. Isso NÃO registra nada no histórico —
   é só o planejamento/cardápio da semana.
   ============================================================ */
const cardapioEditingState = {}; // mealType -> true/false explícito (só nesta sessão, ex: reabriu p/ editar)
function isCardapioEditing(mealType){
  if(cardapioEditingState[mealType] !== undefined) return cardapioEditingState[mealType];
  return !state.cardapioSalvo[mealType]; // nunca foi salvo ainda => começa em modo edição
}
function mealCheckedTotal(mealType){
  const items = state.cardapioUnico[mealType];
  return items.reduce((sum,it)=> sum + (it.checked ? it.kcal : 0), 0);
}
function renderCardapio(){
  return `
    ${heroHTML('cardapio')}
    ${Object.keys(MEAL_LABELS).map(mt=>renderMenuMealCard(mt)).join('')}
  `;
}
function renderMenuMealCard(mealType){
  const items = state.cardapioUnico[mealType];
  const checkedItems = items.filter(it=>it.checked);
  const total = mealCheckedTotal(mealType);
  const editing = isCardapioEditing(mealType);

  return `
    <section class="card menu-meal-card">

          : checkedItems.length+' '+(checkedItems.length===1?'alimento salvo':'alimentos salvos')}</div>
      </div>

      ${editing ? `
        ${items.length===0 ? '<p class="menu-empty-slots">Nenhum alimento ainda. Adicione o primeiro abaixo.</p>' :
          `<div class="menu-food-list">${items.map(it=>renderMenuFoodRow(mealType, it)).join('')}</div>`}

        <button class="menu-add-food-btn" data-add-food="${mealType}"><i data-lucide="plus"></i>Adicionar alimento</button>

        <div class="menu-meal-footer">

          <button class="menu-save-btn" data-save-meal="${mealType}"><i data-lucide="save"></i>Salvar ${MEAL_LABELS[mealType].toLowerCase()}</button>
        </div>
      ` : `
        ${checkedItems.length===0 ? '<p class="menu-empty-slots">Nada salvo ainda neste cardápio.</p>' :
          `<div class="menu-food-list">${checkedItems.map(it=>renderMenuFoodRowView(it)).join('')}</div>`}

        <div class="menu-meal-footer"><div class="mf-total">Total: <b>${Math.round(total)} kcal</b></div></div>
        <button class="btn-outline btn-small full" data-edit-meal="${mealType}"><i data-lucide="pencil"></i>Editar ${MEAL_LABELS[mealType].toLowerCase()}</button>
      `}
    </section>
  `;
}

function updateMeQtyUI(rebuildPresets){
  const food = menuEditor.selected;
  if(!food) return;
  const qtyDisplay = document.getElementById('deQtyDisplay');
  const qtySub = document.getElementById('deQtySub');
  const quickQty = document.getElementById('deQuickQty');
  qtyDisplay.childNodes[0].nodeValue = menuEditor.qty;
  qtySub.textContent = menuEditor.isUnit ? (menuEditor.qty===1?'unidade':'unidades') : (isBeverageFood(food) ? 'ml' : 'gramas');

  if(rebuildPresets){
    const presets = menuEditor.isUnit ? [1,2,3,4] : [50,100,150,200];
    quickQty.innerHTML = presets.map(p=>`<button class="quick-btn" data-qty="${p}">${p}${menuEditor.isUnit?' un':(isBeverageFood(food)?'ml':'g')}</button>`).join('');
  }
  quickQty.querySelectorAll('.quick-btn').forEach(b=>b.classList.toggle('active', parseFloat(b.dataset.qty)===menuEditor.qty));

  if(!menuEditor.aiMacros) return;

  const gramsEquiv = menuEditor.isUnit ? menuEditor.qty*food.unitWeight : menuEditor.qty;
  const factor = gramsEquiv/100;
  const macros = menuEditor.aiMacros;
  const ftMacros = document.getElementById('deMacros');
  ftMacros.children[0].firstElementChild.textContent = Math.round(macros.kcal*factor);
  ftMacros.children[1].firstElementChild.textContent = (Math.round(macros.protein*factor*10)/10)+'g';
  ftMacros.children[2].firstElementChild.textContent = (Math.round(macros.carbs*factor*10)/10)+'g';
  ftMacros.children[3].firstElementChild.textContent = (Math.round(macros.fat*factor*10)/10)+'g';
}
function selectMeFood(food){
  menuEditor.selected = food;
  menuEditor.isUnit = !!food.unit;
  menuEditor.qty = food.unit ? 1 : 100;
  menuEditor.aiMacros = {kcal:food.kcal, protein:food.protein, carbs:food.carbs, fat:food.fat};
  menuEditor.aiLoading = false;

  const ticket = document.getElementById('deTicket');
  if(!ticket) return;
  ticket.classList.add('show');
  document.getElementById('deName').textContent = food.name;
  const deCat = document.getElementById('deCat');
  deCat.textContent = food.category + (food.unit ? ' · medido por unidade' : (isBeverageFood(food) ? ' · medido por ml' : ' · medido por gramas'));
  deCat.classList.remove('loading');
  document.getElementById('deIcon').innerHTML = `<i data-lucide="${CATEGORY_ICONS[food.category] || 'utensils'}"></i>`;
  document.getElementById('deMacros').innerHTML = `
    <div class="ft-macro"><div class="fm-val">0</div><div class="fm-label">kcal</div></div>
    <div class="ft-macro"><div class="fm-val">0g</div><div class="fm-label">prot</div></div>
    <div class="ft-macro"><div class="fm-val">0g</div><div class="fm-label">carb</div></div>
    <div class="ft-macro"><div class="fm-val">0g</div><div class="fm-label">gord</div></div>
  `;
  updateMeQtyUI(true);
  icons();
}
function clearMeFoodSelection(){
  menuEditor.selected = null;
  menuEditor.isUnit = false;
  menuEditor.qty = 100;
  menuEditor.aiMacros = null;
  menuEditor.aiLoading = false;
  const ticket = document.getElementById('deTicket');
  if(ticket) ticket.classList.remove('show');
  const input = document.getElementById('deSearchInput');
  if(input) input.value = '';
}
function wireMenuOptionPicker(){
  const searchInput = document.getElementById('deSearchInput');
  const dropdown = document.getElementById('deDropdown');

  searchInput.addEventListener('input', ()=>{
    const q = normalize(searchInput.value.trim());
    if(q.length===0){ dropdown.classList.add('hidden'); dropdown.innerHTML=''; return; }
    const results = FOOD_DB.filter(f=>normalize(f.name).includes(q)).slice(0,8);
    if(results.length===0){
      dropdown.innerHTML = '<div class="dropdown-empty">Nenhum alimento encontrado</div>';
    } else {
      dropdown.innerHTML = results.map(f=>`
        <div class="dropdown-item" data-food-id="${f.id}">
          <div class="di-icon"><i data-lucide="${CATEGORY_ICONS[f.category] || 'utensils'}"></i></div>
          <div class="di-text"><div class="di-name">${f.name}</div><div class="di-cat">${f.category}${f.unit?' · por unidade':''}</div></div>
        </div>`).join('');
    }
    dropdown.classList.remove('hidden');
    icons();
  });
  dropdown.addEventListener('click', (e)=>{
    const item = e.target.closest('.dropdown-item');
    if(!item) return;
    const id = parseInt(item.dataset.foodId,10);
    const food = FOOD_DB.find(f=>f.id===id);
    if(food){
      searchInput.value = food.name;
      dropdown.classList.add('hidden');
      selectMeFood(food);
    }
  });
  document.getElementById('modalBox').addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) dropdown.classList.add('hidden');
  });

  document.getElementById('deQtyMinus').addEventListener('click', ()=>{
    if(!menuEditor.selected) return;
    const step = menuEditor.isUnit ? 1 : 10;
    const min = menuEditor.isUnit ? 1 : 10;
    menuEditor.qty = clamp(menuEditor.qty-step, min, 5000);
    updateMeQtyUI();
  });
  document.getElementById('deQtyPlus').addEventListener('click', ()=>{
    if(!menuEditor.selected) return;
    const step = menuEditor.isUnit ? 1 : 10;
    menuEditor.qty = clamp(menuEditor.qty+step, 1, 5000);
    updateMeQtyUI();
  });
  document.getElementById('deQuickQty').addEventListener('click', (e)=>{
    const btn = e.target.closest('.quick-btn');
    if(!btn || !menuEditor.selected) return;
    menuEditor.qty = parseFloat(btn.dataset.qty);
    updateMeQtyUI();
  });

  document.getElementById('deIncludeBtn').addEventListener('click', async ()=>{
    if(!menuEditor.selected){ showToast('Selecione um alimento primeiro'); return; }
    const f = menuEditor.selected;
    const macros = menuEditor.aiMacros || {kcal:f.kcal, protein:f.protein, carbs:f.carbs, fat:f.fat};
    const gramsEquiv = menuEditor.isUnit ? menuEditor.qty*f.unitWeight : menuEditor.qty;
    const factor = gramsEquiv/100;
    state.cardapioUnico[menuEditor.mealType].push({
      uid: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      name:f.name, category:f.category, grams:gramsEquiv, qty:menuEditor.qty, isUnit:menuEditor.isUnit,
      kcal:macros.kcal*factor, protein:macros.protein*factor, carbs:macros.carbs*factor, fat:macros.fat*factor,
      checked:false
    });
    showToast('Alimento incluído: '+f.name);
    await saveState();
    clearMeFoodSelection();
  });

  document.getElementById('deDoneBtn').addEventListener('click', closeMenuOptionPicker);
  const overlayEl = document.getElementById('modalOverlay');
  overlayEl.onclick = (e)=>{ if(e.target===overlayEl) closeMenuOptionPicker(); };
}

function wireCardapio(){
  document.querySelectorAll('.menu-meal-card').forEach(card=>{
    card.addEventListener('click', async (e)=>{
      const addFoodBtn = e.target.closest('[data-add-food]');
      if(addFoodBtn){ openMenuOptionPicker(addFoodBtn.dataset.addFood); return; }

      const saveBtn = e.target.closest('[data-save-meal]');
      if(saveBtn){
        const mt = saveBtn.dataset.saveMeal;
        state.cardapioSalvo[mt] = true;
        cardapioEditingState[mt] = false;
        await saveState();
        render();
        showToast(MEAL_LABELS[mt]+' salvo no cardápio!');
        return;
      }

      const editBtn = e.target.closest('[data-edit-meal]');
      if(editBtn){
        cardapioEditingState[editBtn.dataset.editMeal] = true;
        render();
        return;
      }

      const removeBtn = e.target.closest('[data-remove-food]');
      if(removeBtn){
        const mt = removeBtn.dataset.meal, uid = removeBtn.dataset.removeFood;
        state.cardapioUnico[mt] = state.cardapioUnico[mt].filter(it=>it.uid!==uid);
        await saveState();
        render();
        return;
      }

      const row = e.target.closest('[data-toggle-food]');
      if(row){
        const mt = row.dataset.meal, uid = row.dataset.toggleFood;
        const item = state.cardapioUnico[mt].find(it=>it.uid===uid);
        item.checked = !item.checked;
        await saveState();
        render();
      }
    });
  });
}

/* ============================================================
   TAB: CALENDÁRIO
   ============================================================ */
function renderCalendario(){
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthLabel = new Intl.DateTimeFormat('pt-BR', {month:'long', year:'numeric'}).format(calendarViewDate);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = dateStr===today;
    const mark = state.calendarMarks[dateStr];
    const markCls = mark ? MARK_INFO[mark].cls : '';
    cells += `<div class="cal-day ${isToday?'today':''} ${markCls}" data-date="${dateStr}">${d}</div>`;
  }

  const counts = {dieta_treino:0, dieta:0, treino:0};
  Object.keys(state.calendarMarks).forEach(dt=>{
    if(dt.startsWith(year+'-'+String(month+1).padStart(2,'0'))){
      counts[state.calendarMarks[dt]] = (counts[state.calendarMarks[dt]]||0)+1;
    }
  });

  return `
    ${heroHTML('calendario')}
    <section class="card">
      <div class="cal-clock" id="brClock"><i data-lucide="clock-3"></i>Horário de Brasília: ${nowBRTime()}</div>
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev"><i data-lucide="chevron-left"></i></button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="calNext"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="cal-weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="cal-grid" id="calGrid">${cells}</div>
      <div class="cal-legend">
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,var(--accent-1),var(--accent-2))"></span>Dieta + Treino</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent-1)"></span>Só Dieta</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent-2)"></span>Só Treino</div>
      </div>
    </section>
    <section class="cal-counters">
      <div class="counter-card"><div class="cc-num">${counts.dieta_treino}</div><div class="cc-label">Dieta + Treino</div></div>
      <div class="counter-card"><div class="cc-num">${counts.dieta}</div><div class="cc-label">Só Dieta</div></div>
      <div class="counter-card"><div class="cc-num">${counts.treino}</div><div class="cc-label">Só Treino</div></div>
    </section>
  `;
}
function wireCalendario(){
  clearInterval(window.__clockInterval);
  window.__clockInterval = setInterval(()=>{
    const el = document.getElementById('brClock');
    if(el) el.innerHTML = '<i data-lucide="clock-3"></i>Horário de Brasília: '+nowBRTime();
    else { clearInterval(window.__clockInterval); return; }
    icons();
  }, 1000);

  document.getElementById('calPrev').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()-1, 1);
    render();
  });
  document.getElementById('calNext').addEventListener('click', ()=>{
    calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 1);
    render();
  });
  document.getElementById('calGrid').addEventListener('click', (e)=>{
    const cell = e.target.closest('.cal-day');
    if(!cell || cell.classList.contains('empty')) return;
    openDayModal(cell.dataset.date);
  });
}
function openDayModal(dateStr){
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  const current = state.calendarMarks[dateStr];
  box.innerHTML = `
    <h3>${fmtDateLong(dateStr)}</h3>
    <div class="modal-options">
      <button class="modal-opt-btn" data-mark="dieta_treino"><i data-lucide="dumbbell"></i>Dieta + Treino</button>
